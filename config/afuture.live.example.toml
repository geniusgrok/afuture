# CTP 自动跨期套利测试/Shadow 示例。
# 2026-08-21 修正交易日、23:00 同步采样、front-3 Universe 和 volume 门后，
# 两年真实数据经济门拒绝当前策略；因此本文件不再代表“已晋级生产 Alpha”。
[system]
mode = "live"
initial_capital = 500000

[ctp]
environment = "test"
td_address = "tcp://YOUR_TRADE_FRONT"
md_address = "tcp://YOUR_MARKET_FRONT"

[auto]
enabled = true
# M/OI 仅保留为研究/Shadow 候选，便于复现实验与采集真实执行质量；
# corrected evidence 未达到生产晋级门，不能据此直接放大实盘风险。
products = ["m", "OI"]
exchanges = ["DCE", "CZCE"]
max_active_pairs = 1
max_pairs_per_product = 1
max_contracts_per_product = 3
min_days_to_expiry = 20
scan_interval_seconds = 30
max_sync_seconds = 2.0

# 冻结研究参数：log-ratio 相对价值 + 极端偏离后的回归确认。
# 参数保留用于可重复研究，不等于已证明盈利。
lookback = 25
entry_z = 2.5
exit_z = 0.75
stop_z = 4.0
signal_transform = "log_ratio"
confirm_entry = true
confirmation_retrace_z = 0.30
min_confirmed_entry_z = 1.75
entry_trend_window = 6
max_entry_z_slope = 0.75
min_stationarity_score = 0.01
max_half_life = 60

# 研究和生产都只在中国期货交易日 22:55-23:00 内取两腿完全相同时间戳的样本；
# 不允许用日盘或不同时间戳补齐缺腿。
daily_sample_window = "22:55-23:00"
sample_seconds = 0
max_holding_samples = 20
max_pair_volume = 1
structural_mean_shift_z = 3.0
structural_vol_ratio = 2.5
legging_buffer = 50

# 与 corrected 研究一致的活动度门；实盘还要额外通过真实盘口/Net Edge/元数据门。
min_volume = 1000
min_open_interest = 5000
min_liquidity_score = 0.5
min_net_edge = 100
slippage_ticks = 1
metadata_timeout_seconds = 15
session_windows = ["09:00-10:15", "10:30-11:30", "13:30-15:00", "21:00-23:00"]

[risk]
# 未晋级策略只给测试/Shadow 级风险预算。后续只有新的 OOS + Shadow + test-cabinet
# 证据通过后才允许逐步提高，不允许通过放大风险预算制造“100% 年化”。
max_margin_ratio = 0.20
max_daily_loss_ratio = 0.01
max_total_drawdown_ratio = 0.08
max_open_pairs = 1
max_contract_volume = 1
max_quote_age_seconds = 10
max_leg_skew_seconds = 2.0
expiry_blackout_days = 5
min_available_ratio = 0.70
margin_estimate_buffer = 1.25
max_orders_per_minute = 20
min_depth_multiple = 2.0
max_bid_ask_ticks = 3
limit_distance_ticks = 3
risk_budget_ratio = 0.002
risk_sigma_multiplier = 2.5
open_cooldown_minutes = 2
close_blackout_minutes = 5

[execution]
slippage_ticks = 1
aggressive_ticks = 1
auto_flatten_imbalance = true
legging_timeout_seconds = 2.0
conservative_simulation = true
latency_ticks = 1
market_impact_ticks = 1
require_live_metadata = true
metadata_timeout_seconds = 15
heartbeat_interval_seconds = 5

[paths]
state = "runtime/live_state.json"
log = "runtime/afuture.log"
report = "runtime/live_report.json"
journal = "runtime/audit.jsonl"
heartbeat = "runtime/heartbeat.json"
alert = "runtime/alerts.jsonl"

[alert]
webhook = ""