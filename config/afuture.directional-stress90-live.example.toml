# Stress-90 production-wiring example. This file grants no activation approval.
# Keep credentials in AFUTURE_CTP_* environment variables, never in this file.
[system]
mode = "live"
initial_capital = 500000

[ctp]
environment = "test"
td_address = "tcp://YOUR_TRADE_FRONT"
md_address = "tcp://YOUR_MARKET_FRONT"

[directional]
enabled = true
policy = "stress90"
account_exclusive = true
products = [
  "A", "AG", "AL", "AP", "AU", "B", "BC", "BU", "C", "CF", "CJ", "CS",
  "CU", "EB", "EG", "FG", "FU", "HC", "I", "J", "JM", "L", "LH", "LU",
  "M", "MA", "NI", "NR", "OI", "P", "PB", "PF", "PG", "PK", "PP", "RB",
  "RM", "RU", "SA", "SF", "SM", "SN", "SP", "SR", "SS", "TA", "UR", "V",
  "Y", "ZN"
]
exchanges = ["DCE", "CZCE", "SHFE", "INE"]
max_gross_leverage = 2.0
min_days_to_expiry = 20
min_volume = 1000
min_open_interest = 5000
max_contract_volume = 35
# Stress-90 applies the immutable per-product first-entry manifest; this compatibility
# window is retained for legacy manager validation and is not an entry-chasing license.
rebalance_window = "20:55-09:10"
signal_max_age_hours = 96

[risk]
max_margin_ratio = 0.35
max_daily_loss_ratio = 0.05
max_total_drawdown_ratio = 0.30
max_open_pairs = 1
max_contract_volume = 35
max_quote_age_seconds = 10
max_leg_skew_seconds = 2.0
expiry_blackout_days = 5
min_available_ratio = 0.25
margin_estimate_buffer = 1.25
max_orders_per_minute = 60
min_depth_multiple = 2.0
max_bid_ask_ticks = 4
limit_distance_ticks = 3
risk_budget_ratio = 0.005
risk_sigma_multiplier = 2.5
open_cooldown_minutes = 0
close_blackout_minutes = 0

[execution]
slippage_ticks = 1
aggressive_ticks = 1
auto_flatten_imbalance = true
legging_timeout_seconds = 2.0
conservative_simulation = true
latency_ticks = 1
market_impact_ticks = 1
require_live_metadata = true
metadata_timeout_seconds = 15

[paths]
state = "runtime/directional_state.json"
log = "runtime/directional.log"
report = "runtime/directional_report.json"
journal = "runtime/directional_audit.jsonl"
alert = "runtime/directional_alerts.jsonl"
account_registry = "/var/lib/afuture/account-runtime-registry.json"

[alert]
webhook = ""
