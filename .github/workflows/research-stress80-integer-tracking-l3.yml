name: research-stress80-integer-tracking-l3

# Explicit post-registration trigger checkpoint; no strategy semantics changed.
on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-integer-tracking-l3.yml"
      - "afuture/directional_integer_tracking.py"
      - "tests/test_directional_integer_tracking.py"
      - "tools/evaluate_directional_integer_tracking_production.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-integer-tracking-l3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Focused integer tracking TDD
        run: python -m pytest -q tests/test_directional_integer_tracking.py
      - name: Affected Production mechanics smoke
        run: python tools/test_directional_production_mechanics.py
      - name: Download fixed Production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime
      - name: Run fixed Production L3
        run: python tools/evaluate_directional_integer_tracking_production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-integer-tracking-l3
          path: runtime/directional_integer_tracking_production_report.json
          retention-days: 14
      - name: Post result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 integer tracking Production L3 `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/directional_integer_tracking_production_report.json")
          if not path.exists():
              print("\nNo report was produced; inspect workflow failure before economic interpretation.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"\n- baseline reproduction: **{report['baseline_reproduction']}**")
              candidate = report['candidate']
              for label in ('base', 'stress'):
                  windows = candidate[label]['windows']
                  full = windows['full_recent']
                  print(f"- {label.title()} full_recent: **{full['annualized_return']:.6%}**, DD {full['max_drawdown']:.6%}, gross peak {full['max_realized_gross_notional_ratio']:.6f}x, halted={full['halted']}")
              sw = candidate['stress']['windows']
              print(f"- Stress validation: **{sw['validation']['annualized_return']:.6%}**, DD {sw['validation']['max_drawdown']:.6%}")
              print(f"- Stress OOS: **{sw['oos']['annualized_return']:.6%}**, DD {sw['oos']['max_drawdown']:.6%}")
              econ = report['economics']['stress']
              print(f"- Stress turnover: **{econ['turnover_notional']:.2f}**")
              print(f"- Stress net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
              gate = report['promotion_gate']
              print(f"- Stress80 promotion gate: **{gate['passed']}**")
              if gate['reasons']:
                  print("- failed gates: " + ", ".join(gate['reasons']))
          PY
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
