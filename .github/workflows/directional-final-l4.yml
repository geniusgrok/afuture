name: directional-final-l4

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: directional-final-l4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l4:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/afuture-microstructure-cost-alpha-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare
      - name: Retained feature tests
        run: >-
          python -m pytest -q
          tests/test_directional_microstructure.py
          tests/test_directional_lineage.py
          tests/test_sim_event_causality.py
          tests/test_execution_aligned_policy.py
          tests/test_directional_attribution.py
      - run: python -m compileall -q afuture
      - name: Reuse frozen Production L3 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip > /tmp/fixed-l3-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-l3-input.zip" | sha256sum -c -
          unzip -o /tmp/fixed-l3-input.zip -d runtime >/dev/null
          test -s runtime/broad_daily_universe.csv
          test -s runtime/return_target_specific_contracts.csv
      - name: Reproduce frozen Production economics
        run: python tools/evaluate_directional_production_mechanics.py
      - name: Verify exact lineage closure
        run: python tools/evaluate_directional_lineage.py
      - name: Assert baseline economics and lineage
        run: |
          python - <<'PY'
          import json
          from math import isclose

          report = json.load(open("runtime/directional_production_mechanics_report.json", encoding="utf-8"))
          base = report["base"]["windows"]["full_recent"]
          stress = report["stress"]["windows"]["full_recent"]
          assert isclose(base["annualized_return"], 1.0906361799188824, rel_tol=0, abs_tol=1e-12)
          assert isclose(base["max_drawdown"], -0.15852942161731598, rel_tol=0, abs_tol=1e-12)
          assert isclose(base["sharpe"], 2.0975562271570025, rel_tol=0, abs_tol=1e-12)
          assert base["halted"] is False
          assert isclose(stress["annualized_return"], 0.2895586436150601, rel_tol=0, abs_tol=1e-12)
          assert isclose(stress["max_drawdown"], -0.2811516529064918, rel_tol=0, abs_tol=1e-12)
          assert isclose(stress["sharpe"], 0.9603659973923214, rel_tol=0, abs_tol=1e-12)
          assert stress["halted"] is False
          assert stress["margin_reject_days"] == 0
          assert report["mechanics"]["target_gross_leverage_cap"] == 2.0
          assert report["mechanics"]["max_contract_volume"] == 35
          tx = report["production_attribution"]["stress"]["transaction_cost"]
          assert isclose(tx["turnover_notional"], 256918290.0, rel_tol=0, abs_tol=1e-6)
          assert isclose(tx["total_cost"], 385377.435, rel_tol=0, abs_tol=1e-6)

          lineage = json.load(open("runtime/directional_lineage_report.json", encoding="utf-8"))
          assert lineage["production_policy_modified"] is False
          assert lineage["template_cost_allocation"] is False
          assert lineage["base"]["cost_reconciles_to_trade_ledger"] is True
          assert lineage["base"]["turnover_reconciles_to_trade_ledger"] is True
          assert lineage["stress"]["cost_reconciles_to_trade_ledger"] is True
          assert lineage["stress"]["turnover_reconciles_to_trade_ledger"] is True
          assert isclose(lineage["stress"]["turnover_notional"], 256918290.0, rel_tol=0, abs_tol=1e-6)
          assert isclose(lineage["stress"]["transaction_cost"], 385377.435, rel_tol=0, abs_tol=1e-6)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-final-l4-evidence
          path: |
            runtime/directional_production_mechanics_report.json
            runtime/directional_production_base_daily.csv
            runtime/directional_production_stress_daily.csv
            runtime/directional_production_base_events.csv
            runtime/directional_production_stress_events.csv
            runtime/directional_lineage_report.json
            runtime/directional_lineage_meta.csv
            runtime/directional_lineage_template_product.csv
            runtime/directional_lineage_base_product_execution.csv
            runtime/directional_lineage_stress_product_execution.csv
          retention-days: 14
