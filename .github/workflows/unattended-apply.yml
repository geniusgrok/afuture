name: unattended-apply

# Temporary source transfer on this feature branch only. No broker or deployment.
on:
  push:
    branches: [codex/unattended-24x7-20260922]
    paths: [.github/workflows/unattended-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify bounded patch, commit and push without force
        run: python .github/unattended-transfer/apply.py
      - uses: actions/upload-artifact@v4
        with:
          name: afuture-applied-source-${{ github.sha }}
          path: ${{ runner.temp }}/afuture-applied-source/
          if-no-files-found: error
          retention-days: 7
