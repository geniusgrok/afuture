name: docs-provenance-temp

on:
  push:
    branches:
      - codex/deployment-provenance-recovery

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append authoritative provenance and recovery guidance
        shell: bash
        run: |
          if ! grep -q '^## 部署来源、可验证备份与恢复$' docs/stress90-live-runbook.md; then
            cat >> docs/stress90-live-runbook.md <<'EOF'

## 部署来源、可验证备份与恢复

生产部署不再把“某个 checkout + 某个 runtime 目录”当成隐含事实。固定历史 bootstrap 完成后，先从**从未绑定实盘账户**的干净 bootstrap runtime 生成确定性 bundle，并在目标机安装、封存部署身份：

```bash
afuture stress90-bundle-create \
  --config /secure/path/afuture.directional-stress90.toml \
  --runtime-dir /secure/path/clean-bootstrap-runtime \
  --output /secure/backup/stress90-bootstrap.tar

afuture stress90-bundle-verify \
  --bundle /secure/backup/stress90-bootstrap.tar

afuture stress90-bundle-install \
  --config /secure/path/afuture.directional-stress90.toml \
  --bundle /secure/backup/stress90-bootstrap.tar \
  --runtime-dir runtime
```

生产 bundle 只接受官方固定输入摘要、固定 candidate、精确历史 parity 和未绑定账户的 seed/policy/OI/OHLC/activity 证据。tar 成员必须是 allowlist 内普通文件；路径穿越、绝对路径、重复成员、软/硬链接、未知成员、超限尺寸、截断、附加垃圾或字节篡改全部失败关闭。测试 fixture 永远不能成为 production-ready bundle。安装目标必须为空，先在同一父目录 staging 并完成语义验证，再原子发布；失败不得留下可被误认为已安装 runtime 的半成品。

在最终目标机、最终 Python 虚拟环境且 `vnpy_ctp` 已安装后封存 deployment identity：

```bash
afuture deployment-seal \
  --config /secure/path/afuture.directional-stress90.toml \
  --bundle /secure/backup/stress90-bootstrap.tar \
  --runtime-dir runtime

afuture deployment-verify \
  --config /secure/path/afuture.directional-stress90.toml \
  --runtime-dir runtime
```

seal 绑定当前 Git HEAD、tracked production source tree digest、生产配置、core/live constraints、Python/OS/CPU/executable、canonical runtime、machine account registry、bundle/seed/policy/products/risk-overlay 以及目标机 `vnpy_ctp` 原生模块身份。生产配置下 `status` 会显示 deployment 诊断；`doctor`、`shadow`、`live` 在 deployment 不匹配时必须先失败，不允许通过已有 permit 绕过。重新 seal 会使既有 technical activation permit 失效，必须重新 Doctor。

需要备份时先主动停到 `HALTED` 且保持 `kill_switch=true`，确认 lifecycle transaction 不处于 `prepared`，然后只备份显式 allowlist 的账户/策略/执行/交易日/订单 journal/registry/nonce-ledger 权威证据：

```bash
afuture backup-runtime \
  --config /secure/path/afuture.directional-stress90.toml \
  --output /secure/backup/stress90-runtime.tar

afuture verify-backup \
  --backup /secure/backup/stress90-runtime.tar
```

备份不会递归打包 runtime，不包含日志、报告、告警、配置或凭证；检测到当前环境中的原始账户/认证秘密出现在待备份字节中也会拒绝。验证会重新 materialize 到临时目录并通过现有 State/Policy/OI/OHLC/Activity/ExecutionIntent/CTP journal/registry/TradingDayEvidence/DeploymentIdentity 等 loader 复核跨文件身份和链路，不能只靠 tar 能解压或单个 checksum 就判定可恢复。

恢复只允许写入**空 runtime** 和明确的 registry staging 路径，并且 source canonical runtime / registry identity 必须与备份一致；此命令不连接 Broker、不会报单或撤单：

```bash
afuture restore-runtime \
  --backup /secure/backup/stress90-runtime.tar \
  --runtime-dir runtime \
  --account-registry-path /var/lib/afuture/account-runtime-registry.json \
  --registry-staging-path /var/lib/afuture/account-runtime-registry.restore-stage
```

恢复成功后仍必须是 `HALTED`、`kill_switch=true`，原 technical activation permit 必须失效。随后严格按 `status` → `deployment-verify` → 无报单 `doctor` → fresh technical permit 的顺序继续；任何 source/config/constraints/native module/runtime/registry/risk overlay 漂移都先保持停机。`.prev` 仍只是诊断前驱证据，bundle 和 backup 也都不能成为自动解除停机或自动恢复交易权限的入口。
EOF
          fi

          if ! grep -q '^## 部署来源与恢复验收$' docs/production-checklist.md; then
            cat >> docs/production-checklist.md <<'EOF'

## 部署来源与恢复验收

- [ ] production bootstrap bundle 由官方固定摘要与固定 candidate 生成，`stress90-bundle-verify` 明确通过；测试 fixture 没有进入生产路径。
- [ ] bundle 安装目标为空，安装后 seed/policy/OI/OHLC/activity identity 与 manifest 完全一致，未生成账户绑定、permit 或订单事实。
- [ ] 最终目标机、最终虚拟环境、最终 `vnpy_ctp` 已就绪后执行 `deployment-seal`；`deployment-verify` 对 Git HEAD、tracked source digest、配置、constraints、Python/OS/CPU/executable、runtime、registry、bundle、risk overlay 和 native module 均无漂移。
- [ ] production `status` 能显示 deployment 诊断；deployment 不匹配时 `doctor`/`shadow`/`live` 失败关闭，不能依赖旧 permit 继续运行。
- [ ] 至少完成一次 `HALTED` + `kill_switch=true` 的 `backup-runtime` 与独立 `verify-backup`；备份成员只有 allowlist 权威证据，不含配置、日志、报告、告警和原始凭证。
- [ ] 至少完成一次离线恢复演练：目标 runtime 为空、registry staging 独立、恢复过程零 Broker writes，恢复结果保持 `HALTED` + kill switch，旧 technical permit 失效。
- [ ] 恢复演练后按 `status` → `deployment-verify` → 无报单 `doctor` → fresh permit 完成重新准入；任何身份漂移都先停机解释，不手工复制 `.prev` 或修改 checksum。
EOF
          fi

          if ! grep -q '^## Deployment / backup / restore 故障$' docs/troubleshooting.md; then
            cat >> docs/troubleshooting.md <<'EOF'

## Deployment / backup / restore 故障

`deployment-verify` 失败时先查看 `changes`。Git HEAD、tracked source、配置、constraints、Python/OS/CPU/executable、canonical runtime、machine registry、bundle、risk overlay 或 `vnpy_ctp` 任一变化都属于部署身份变化；保持 `HALTED`，确认变化是预期且 runtime 仍与 bundle/policy 一致后才能重新 seal。重新 seal 会要求 fresh Doctor permit，不能保留旧 permit 继续交易。

`verify-backup` 因 archive member、checksum、journal、registry、TradingDayEvidence、deployment 或跨文件 identity 失败时，把原 backup 当事故证据保留，不解压覆盖 current，不删除失败成员，不从 `.prev` 拼接新 current。路径穿越、绝对路径、重复项、链接成员、未知成员、超限、截断、尾随字节都按损坏或篡改处理。

`restore-runtime` 报目标非空、runtime/registry identity 不一致或 registry staging 不安全，是预期的 fail-closed 边界。不要为了“恢复成功”清空仍在使用的目录或改 manifest；先确认旧进程停止、目标确实为空且备份对应同一 canonical runtime/registry。恢复完成后仍处于 `HALTED` 且 kill switch 开启，permit 失效属于设计行为；下一步只能是 `status`、`deployment-verify`、无报单 `doctor` 和 fresh permit。
EOF
          fi

          git diff --check
      - name: Commit documentation updates
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/stress90-live-runbook.md docs/production-checklist.md docs/troubleshooting.md
          git commit -m 'docs: document deployment provenance and recovery'
          git push origin HEAD:codex/deployment-provenance-recovery
