name: docs-provenance-temp

on:
  push:
    branches:
      - codex/deployment-provenance-recovery

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/update_provenance_docs_temp.py
      - run: git diff --check
      - name: Commit documentation updates
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/stress90-live-runbook.md docs/production-checklist.md docs/troubleshooting.md
          git commit -m 'docs: document deployment provenance and recovery'
          git push origin HEAD:codex/deployment-provenance-recovery
