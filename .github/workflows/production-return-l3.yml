name: production-return-l3

on:
  pull_request:
    branches:
      - main
    paths:
      - afuture/directional.py
      - afuture/directional_acceptance.py
      - afuture/directional_engine.py
      - afuture/directional_risk.py
      - afuture/execution_aligned_policy.py
      - afuture/execution_aligned_runtime.py
      - config/afuture.directional-live.example.toml
      - tools/evaluate_directional_production_mechanics.py
      - .github/workflows/production-return-l3.yml

concurrency:
  group: production-return-l3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  frozen-production-evidence:
    if: github.head_ref == 'codex/afuture-production-return-100-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Download frozen evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/specific runtime
          gh api /repos/${{ github.repository }}/actions/artifacts/9473260618/zip > /tmp/specific.zip
          unzip -q /tmp/specific.zip -d /tmp/specific
          test -s /tmp/specific/return_target_specific_contracts.csv
          test -s /tmp/specific/broad_daily_universe.csv
      - name: Generate weights with current production policy and evaluate mechanics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from afuture.execution_aligned_policy import ExecutionAlignedAggressivePolicy
          from afuture.execution_aligned_runtime import FROZEN_PRODUCTS
          from tools.evaluate_directional_production_mechanics import evaluate_with_weights, _jsonable

          specific = pd.read_csv('/tmp/specific/return_target_specific_contracts.csv')
          continuous = pd.read_csv('/tmp/specific/broad_daily_universe.csv')
          continuous['date'] = pd.to_datetime(continuous['date'], errors='coerce')
          continuous['product'] = continuous['product'].astype(str).str.upper()
          for column in ('open', 'close'):
              continuous[column] = pd.to_numeric(continuous[column], errors='coerce')
          continuous = continuous.dropna(subset=['date', 'product', 'open', 'close'])
          continuous = continuous[(continuous['open'] > 0) & (continuous['close'] > 0)]
          continuous = continuous.drop_duplicates(['date', 'product'], keep='last')
          products = tuple(FROZEN_PRODUCTS)
          open_prices = continuous.pivot(index='date', columns='product', values='open').sort_index().reindex(columns=products)
          close = continuous.pivot(index='date', columns='product', values='close').sort_index().reindex(index=open_prices.index, columns=products)
          if open_prices.isna().all(axis=0).any() or close.isna().all(axis=0).any():
              missing = [p for p in products if open_prices[p].isna().all() or close[p].isna().all()]
              raise AssertionError(f'missing frozen products in continuous evidence: {missing}')

          policy = ExecutionAlignedAggressivePolicy(products=products)
          weights = policy.weight_history(open_prices, close)
          weights.stack().rename('weight').reset_index().query('abs(weight) > 1e-15').to_csv(
              'runtime/current_production_weights.csv', index=False
          )
          report = evaluate_with_weights(specific, weights, float_report=None)
          clean = _jsonable(report)
          Path('runtime/directional_production_mechanics_report.json').write_text(
              json.dumps(clean, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          report['_base_daily'].to_csv('runtime/directional_production_base_daily.csv')
          report['_stress_daily'].to_csv('runtime/directional_production_stress_daily.csv')

          base = report['base']['windows']['full_recent']
          stress = report['stress']['windows']['full_recent']
          print('META', json.dumps({
              'lookback': policy.meta_lookback,
              'rebalance': policy.meta_rebalance,
              'count': policy.meta_count,
          }, sort_keys=True))
          print('BASE_FULL_RECENT', json.dumps(base, sort_keys=True))
          print('STRESS_FULL_RECENT', json.dumps(stress, sort_keys=True))
          print('BASE_WINDOWS', json.dumps(report['base']['windows'], sort_keys=True))
          print('STRESS_WINDOWS', json.dumps(report['stress']['windows'], sort_keys=True))

          target_gross = float(weights.abs().sum(axis=1).max())
          print('MAX_TARGET_GROSS', target_gross)
          assert target_gross <= 2.0 + 1e-10, target_gross
          assert report['mechanics']['target_gross_leverage_cap'] == 2.0
          assert report['mechanics']['max_contract_volume'] == 35
          assert base['annualized_return'] >= 1.0, base
          assert base['max_drawdown'] >= -0.30, base
          assert base['max_realized_gross_notional_ratio'] <= 2.0 + 1e-10, base
          assert base['halted'] is False, base
          assert base['daily_circuit_days'] > 0, base
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-return-l3-${{ github.sha }}
          path: |
            runtime/current_production_weights.csv
            runtime/directional_production_mechanics_report.json
            runtime/directional_production_base_daily.csv
            runtime/directional_production_stress_daily.csv
          if-no-files-found: warn
