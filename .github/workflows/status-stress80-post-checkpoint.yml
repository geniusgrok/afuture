name: status-stress80-post-checkpoint

# Refresh after freeze-new-product-only GREEN implementation.
on:
  push:
    branches:
      - research/stress80-post-checkpoint
    paths:
      - ".github/workflows/status-stress80-post-checkpoint.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Post research workflow status to PR 23
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --limit 20 \
            --json databaseId,name,status,conclusion,headSha,createdAt > /tmp/runs.json
          python - <<'PY' > /tmp/status.md
          import json, os
          rows = json.load(open('/tmp/runs.json', encoding='utf-8'))
          print(f"### Stress80 post-checkpoint status `{os.environ['GITHUB_RUN_ID']}`")
          print()
          for row in rows:
              print(f"- `{row['databaseId']}` **{row['name']}**: {row['status']} / {row.get('conclusion') or '-'} @ `{str(row.get('headSha') or '')[:8]}`")
          PY
          gh pr comment 23 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
