name: research-stress80-dce-oi-extension-l3

# One lifecycle-defined information extension only. The OI rule itself is unchanged.
on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-dce-oi-extension-l3.yml"
      - "afuture/directional_60m_oi_dce_extension.py"
      - "tests/test_directional_60m_oi_dce_extension.py"
      - "tools/evaluate_directional_60m_oi_dce_extension.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-dce-oi-extension-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: DCE OI extension TDD gate
        run: >-
          python -m pytest -q
          tests/test_directional_60m_oi_dce_extension.py
          tests/test_directional_60m_oi_confirmation.py
          tests/test_directional_60m_oi_production_gate.py
      - name: Affected Production mechanics smoke
        run: python tools/test_directional_production_mechanics.py

      - name: Download fixed Production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime

      - name: Download frozen original 60m evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516473115/zip" \
            -o /tmp/prior.zip
          echo "d0adcfb348c5ae89ddb488474c088d74a2402a2426c0e84fee7877dda5bd2a4e  /tmp/prior.zip" | sha256sum -c -
          unzip -j /tmp/prior.zip prior_two_year_broad_60m.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516472727/zip" \
            -o /tmp/recent.zip
          echo "68ff2200eed8326741ce76f1cff46379c4e1dbc263297f4602bd84422e95e421  /tmp/recent.zip" | sha256sum -c -
          unzip -j /tmp/recent.zip two_year_broad_60m.csv -d runtime

      - name: Download lifecycle-defined DCE extension evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9524037509/zip" \
            -o /tmp/ext-prior.zip
          echo "8a103b63e8a485706dbadf2d59994bf5c14f4f6235861773035cd3eb7a0c289b  /tmp/ext-prior.zip" | sha256sum -c -
          unzip -j /tmp/ext-prior.zip dce_keymonth_prior_60m.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9524033190/zip" \
            -o /tmp/ext-recent.zip
          echo "0d7b10df4fb53ddd9d73f7eb099efd44fcc753c8440609092d64e8cfda137e65  /tmp/ext-recent.zip" | sha256sum -c -
          unzip -j /tmp/ext-recent.zip dce_keymonth_recent_60m.csv -d runtime

      - name: Run fixed extended OI Production L3
        run: python tools/evaluate_directional_60m_oi_dce_extension.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-dce-oi-extension-l3
          path: runtime/stress80_60m_oi_dce_extension_report.json
          retention-days: 14

      - name: Post result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 DCE lifecycle OI extension L3 `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/stress80_60m_oi_dce_extension_report.json")
          if not path.exists():
              print("\nNo report was produced; inspect workflow failure before economic interpretation.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              coverage = report['coverage_gate']
              print(f"\n- coverage gate: **{coverage['passed']}**, usable `{coverage['usable_products']}`")
              candidate = report['candidate']
              base = candidate['base']['windows']
              stress = candidate['stress']['windows']
              print(f"- Base full_recent: **{base['full_recent']['annualized_return']:.6%}**, DD {base['full_recent']['max_drawdown']:.6%}")
              print(f"- Stress full_recent: **{stress['full_recent']['annualized_return']:.6%}**, DD {stress['full_recent']['max_drawdown']:.6%}")
              print(f"- Stress validation: **{stress['validation']['annualized_return']:.6%}**, DD {stress['validation']['max_drawdown']:.6%}")
              print(f"- Stress OOS: **{stress['oos']['annualized_return']:.6%}**, DD {stress['oos']['max_drawdown']:.6%}")
              econ = report['economics']['stress']
              print(f"- Stress turnover: **{econ['turnover_notional']:.2f}**")
              print(f"- Stress net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
              improve = report['independent_improvement_gate']
              print(f"- independent improvement gate: **{improve['passed']}**, Stress delta vs 9-product OI **{improve['stress_annualized_delta_vs_oi9']:+.6%}**")
              print(f"- Stress80 promotion gate: **{report['promotion_gate']['passed']}**")
              if report['promotion_gate']['reasons']:
                  print("- failed gates: " + ", ".join(report['promotion_gate']['reasons']))
          PY
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
