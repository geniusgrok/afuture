name: research-stress80-cost-aware-no-trade-l3

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-cost-aware-no-trade-l3.yml"
      - "afuture/directional_cost_aware_no_trade.py"
      - "tests/test_directional_cost_aware_no_trade.py"
      - "tools/evaluate_directional_cost_aware_no_trade.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-cost-aware-no-trade-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download fixed input and validated baseline weights
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip \
            broad_daily_universe.csv \
            return_target_specific_contracts.csv \
            -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/validated-baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/validated-baseline.zip" | sha256sum -c -
          unzip -j /tmp/validated-baseline.zip execution_aligned_weights.csv -d runtime
      - name: Verify focused cost-aware behavior
        run: python -m pytest -q tests/test_directional_cost_aware_no_trade.py
      - name: Reproduce archived cheap screen then run Production L3
        run: python tools/evaluate_directional_cost_aware_no_trade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-cost-aware-no-trade-l3
          path: runtime/cost_aware_no_trade_production_report.json
          retention-days: 14
      - name: Post cost-aware Production result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/cost-aware-comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 cost-aware no-trade Production L3 `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/cost_aware_no_trade_production_report.json")
          if not path.exists():
              print("\nNo report was produced; inspect workflow failure before economic interpretation.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              lineage = report["legacy_lineage"]
              print(f"\n- archived cheap-screen lineage matched: **{lineage['matched']}**")
              print(f"- candidate weight turnover: **{report['weight_turnover']['candidate']:.4f}x**")
              cheap = report["cheap_screen"]
              print(f"- cheap Base full_recent: **{cheap['base']['full_recent']['annualized_return']:.6%}**")
              print(f"- cheap Stress full_recent: **{cheap['stress']['full_recent']['annualized_return']:.6%}**")
              if report.get("production_l3") is not None:
                  prod = report["production_l3"]
                  base = prod["base"]["windows"]
                  stress = prod["stress"]["windows"]
                  print(f"- Production Base full_recent: **{base['full_recent']['annualized_return']:.6%}**, DD {base['full_recent']['max_drawdown']:.6%}")
                  print(f"- Production Stress full_recent: **{stress['full_recent']['annualized_return']:.6%}**, DD {stress['full_recent']['max_drawdown']:.6%}")
                  print(f"- Production Stress validation: **{stress['validation']['annualized_return']:.6%}**, DD {stress['validation']['max_drawdown']:.6%}")
                  print(f"- Production Stress OOS: **{stress['oos']['annualized_return']:.6%}**, DD {stress['oos']['max_drawdown']:.6%}")
                  econ = report["economics"]["stress"]
                  print(f"- Stress turnover: **{econ['turnover_notional']:.2f}**")
                  print(f"- Stress net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
              gate = report["promotion_gate"]
              print(f"- Stress80 promotion gate: **{gate['passed']}**")
              if gate["reasons"]:
                  print("- failed gates: " + ", ".join(gate["reasons"]))
          PY
          gh pr comment 21 --body-file /tmp/cost-aware-comment.md
