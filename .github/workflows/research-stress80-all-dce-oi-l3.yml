name: research-stress80-all-dce-oi-l3

# Structural completion of the DCE 60m OI information surface; rule unchanged.
on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-all-dce-oi-l3.yml"
      - "afuture/directional_60m_oi_all_dce.py"
      - "tests/test_directional_60m_oi_all_dce.py"
      - "tools/evaluate_directional_60m_oi_all_dce.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-all-dce-oi-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Structurally complete DCE OI TDD gate
        run: >-
          python -m pytest -q
          tests/test_directional_60m_oi_all_dce.py
          tests/test_directional_60m_oi_dce_extension.py
          tests/test_directional_60m_oi_confirmation.py
          tests/test_directional_60m_oi_production_gate.py
      - name: Affected Production mechanics smoke
        run: python tools/test_directional_production_mechanics.py

      - name: Download fixed Production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime

      - name: Download original 9-product 60m evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516473115/zip" -o /tmp/prior.zip
          echo "d0adcfb348c5ae89ddb488474c088d74a2402a2426c0e84fee7877dda5bd2a4e  /tmp/prior.zip" | sha256sum -c -
          unzip -j /tmp/prior.zip prior_two_year_broad_60m.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516472727/zip" -o /tmp/recent.zip
          echo "68ff2200eed8326741ce76f1cff46379c4e1dbc263297f4602bd84422e95e421  /tmp/recent.zip" | sha256sum -c -
          unzip -j /tmp/recent.zip two_year_broad_60m.csv -d runtime

      - name: Download first DCE lifecycle extension
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9524037509/zip" -o /tmp/ext-prior.zip
          echo "8a103b63e8a485706dbadf2d59994bf5c14f4f6235861773035cd3eb7a0c289b  /tmp/ext-prior.zip" | sha256sum -c -
          unzip -j /tmp/ext-prior.zip dce_keymonth_prior_60m.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9524033190/zip" -o /tmp/ext-recent.zip
          echo "0d7b10df4fb53ddd9d73f7eb099efd44fcc753c8440609092d64e8cfda137e65  /tmp/ext-recent.zip" | sha256sum -c -
          unzip -j /tmp/ext-recent.zip dce_keymonth_recent_60m.csv -d runtime

      - name: Download remaining structural DCE coverage evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9525335945/zip" -o /tmp/rem-prior.zip
          echo "346fe364e47d19d0209f8038aa5afa521f55f173d0468a6afaec4c0fe88902a2  /tmp/rem-prior.zip" | sha256sum -c -
          unzip -j /tmp/rem-prior.zip dce_remaining_prior_60m.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9525324355/zip" -o /tmp/rem-recent.zip
          echo "014e626b31da7c3b1bc0f617f098c80d4935bc5345e77810b4b87b717ed9ba59  /tmp/rem-recent.zip" | sha256sum -c -
          unzip -j /tmp/rem-recent.zip dce_remaining_recent_60m.csv -d runtime

      - name: Run fixed all-DCE OI Production L3
        run: python tools/evaluate_directional_60m_oi_all_dce.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-all-dce-oi-l3
          path: runtime/stress80_60m_oi_all_dce_report.json
          retention-days: 14
      - name: Post result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          print(f"### Stress80 structurally complete DCE OI L3 `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/stress80_60m_oi_all_dce_report.json")
          if not path.exists():
              print("\nNo report was produced; inspect workflow failure before economic interpretation.")
          else:
              r=json.loads(path.read_text(encoding="utf-8")); c=r['candidate']; s=c['stress']['windows']; b=c['base']['windows']; e=r['economics']['stress']; g=r['independent_improvement_gate']
              print(f"\n- coverage gate: **{r['coverage_gate']['passed']}**, usable `{r['coverage_gate']['usable_products']}`")
              print(f"- Base full_recent: **{b['full_recent']['annualized_return']:.6%}**, DD {b['full_recent']['max_drawdown']:.6%}")
              print(f"- Stress full_recent: **{s['full_recent']['annualized_return']:.6%}**, DD {s['full_recent']['max_drawdown']:.6%}")
              print(f"- Stress validation: **{s['validation']['annualized_return']:.6%}**, OOS **{s['oos']['annualized_return']:.6%}**")
              print(f"- Stress turnover: **{e['turnover_notional']:.2f}**, net alpha/turnover **{e['net_alpha_per_turnover_bps']:.6f} bps**")
              print(f"- independent improvement gate: **{g['passed']}**, delta vs 13-product OI **{g['stress_delta_vs_13product_oi']:+.6%}**")
              print(f"- Stress80 promotion gate: **{r['promotion_gate']['passed']}**")
              if r['promotion_gate']['reasons']: print("- failed gates: " + ", ".join(r['promotion_gate']['reasons']))
          PY
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
