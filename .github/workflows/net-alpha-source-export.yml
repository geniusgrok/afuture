name: net-alpha-source-export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'codex/afuture-net-alpha-efficiency-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: net-alpha-source-${{ github.event.pull_request.head.sha }}
          include-hidden-files: true
          path: |
            afuture
            tests
            tools
            config
            docs
            examples
            .github/workflows
            README.md
            AGENTS.md
            pyproject.toml
            requirements.txt
          retention-days: 3
