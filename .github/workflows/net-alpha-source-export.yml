name: net-alpha-source-export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  export:
    if: github.head_ref == 'codex/afuture-net-alpha-efficiency-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: net-alpha-source-${{ github.event.pull_request.head.sha }}
          include-hidden-files: true
          path: |
            afuture
            tests
            tools
            config
            docs
            examples
            .github/workflows
            README.md
            AGENTS.md
            pyproject.toml
            requirements.txt
          retention-days: 3

  fixed-task1-l3:
    if: github.head_ref == 'codex/afuture-net-alpha-efficiency-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Targeted Task 1 L2
        run: |
          python -m pytest -q \
            tests/test_directional_attribution.py \
            tests/test_directional_execution_efficiency.py \
            tests/test_directional_acceptance.py \
            tests/test_directional_acceptance_simulation.py \
            tests/test_directional_stress_robustness.py \
            tests/test_execution_aligned_policy.py
          python tools/test_directional_production_mechanics.py
          python -m compileall -q afuture tools/evaluate_directional_production_mechanics.py
      - name: Download frozen L3 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/frozen-input runtime/prior-output runtime/task1
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip > /tmp/l3-input.zip
          unzip -q /tmp/l3-input.zip -d runtime/frozen-input
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip > /tmp/l3-output.zip
          unzip -q /tmp/l3-output.zip -d runtime/prior-output
      - name: Fixed principal-window attribution replay
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path
          import pandas as pd

          tool_path = Path('tools/evaluate_directional_production_mechanics.py')
          spec = importlib.util.spec_from_file_location('task1_pm', tool_path)
          pm = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = pm
          spec.loader.exec_module(pm)
          pm.WINDOWS = {'full_recent': ('2024-08-21', '2026-08-20')}

          raw = pd.read_csv('runtime/frozen-input/return_target_specific_contracts.csv')
          raw['date'] = pd.to_datetime(raw['date'])
          raw = raw[(raw['date'] >= pd.Timestamp('2024-08-20')) & (raw['date'] <= pd.Timestamp('2026-08-20'))].copy()
          long = pd.read_csv('runtime/prior-output/execution_aligned_weights.csv')
          long['level_0'] = pd.to_datetime(long['level_0'])
          weights = long.pivot(index='level_0', columns='level_1', values='weight').fillna(0.0).sort_index()
          weights = weights.loc['2024-08-21':'2026-08-20']

          report = pm.evaluate_with_weights(raw, weights)
          expected = {
              'base': {
                  'annualized_return': 1.0906361799188824,
                  'total_return': 3.122284849999997,
                  'max_drawdown': -0.15852942161731598,
                  'sharpe': 2.0975562271570025,
                  'active_days': 478,
                  'max_realized_gross_notional_ratio': 1.998252924849566,
                  'margin_reject_days': 0,
                  'halted': False,
              },
              'stress': {
                  'annualized_return': 0.2895586436150601,
                  'total_return': 0.6297351300000005,
                  'max_drawdown': -0.2811516529064918,
                  'sharpe': 0.9603659973923214,
                  'active_days': 474,
                  'max_realized_gross_notional_ratio': 1.668769082881959,
                  'margin_reject_days': 0,
                  'halted': False,
              },
          }
          for label, wanted in expected.items():
              got = report[label]['windows']['full_recent']
              for key, value in wanted.items():
                  if isinstance(value, bool):
                      assert bool(got[key]) is value, (label, key, got[key], value)
                  elif isinstance(value, int):
                      assert int(got[key]) == value, (label, key, got[key], value)
                  else:
                      assert abs(float(got[key]) - value) < 1e-10, (label, key, got[key], value)

          for label in ('base', 'stress'):
              attr = report['production_attribution'][label]
              turnover = report['turnover_attribution'][label]
              assert abs(attr['transaction_cost']['turnover_notional'] - turnover['total']) < 1e-6
              expected_cost = turnover['total'] * report[label]['cost_bps'] / 10000.0
              assert abs(attr['transaction_cost']['total_cost'] - expected_cost) < 1e-6
              assert abs(
                  attr['alpha']['gross_signal_pnl']
                  - attr['alpha']['long_pnl']
                  - attr['alpha']['short_pnl']
              ) < 1e-6
              assert abs(
                  sum(attr['alpha']['product_pnl'].values())
                  - attr['alpha']['gross_signal_pnl']
              ) < 1e-6

          out = Path('runtime/task1')
          out.mkdir(parents=True, exist_ok=True)
          summary = {
              'base': report['base']['windows']['full_recent'],
              'stress': report['stress']['windows']['full_recent'],
              'turnover_attribution': report['turnover_attribution'],
              'production_attribution': report['production_attribution'],
              'lineage_note': {
                  'archived_float_stress_annualized': 0.581372,
                  'current_lineage_float_stress_annualized_from_pr14_report': 1.0931450664777795,
                  'archived_float_is_not_current_lineage_counterfactual': True,
              },
          }
          (out / 'task1_attribution_l3.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          report['_base_events'].to_csv(out / 'base_events.csv', index=False)
          report['_stress_events'].to_csv(out / 'stress_events.csv', index=False)
          report['_base_daily'].to_csv(out / 'base_daily.csv')
          report['_stress_daily'].to_csv(out / 'stress_daily.csv')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net-alpha-task1-attribution-${{ github.event.pull_request.head.sha }}
          path: runtime/task1
          retention-days: 14
