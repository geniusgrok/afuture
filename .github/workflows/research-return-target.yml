name: research-return-target

# Research-only historical evidence: manual evaluation, not a forecast or promotional claim.
# Expensive L3 milestone gate. The 2026-08-22 return-target evidence is frozen;
# rerun manually only after a material change to the research methodology or universe.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-return-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  return-target:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install akshare pandas numpy
          -c constraints/core-dev.txt -c constraints/live.txt
      - name: Verify market-neutral return-target bounds
        run: python tools/test_return_target_portfolio.py
      - name: Verify aggressive directional causality and bounds
        run: python tools/test_aggressive_directional.py
      - name: Fetch broad Chinese commodity daily universe
        run: python tools/fetch_broad_daily_universe.py
      - name: Search low-leverage market-neutral return target
        run: python tools/evaluate_return_target_portfolio.py
      - name: Search aggressive low-leverage directional return target
        run: python tools/evaluate_aggressive_directional.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-target-evidence
          path: |
            runtime/broad_daily_universe.csv
            runtime/broad_daily_universe_summary.csv
            runtime/broad_daily_universe_failures.txt
            runtime/return_target_report.json
            runtime/return_target_template_results.csv
            runtime/aggressive_directional_report.json
            runtime/aggressive_directional_results.csv
            runtime/aggressive_directional_weights.csv
          retention-days: 14
