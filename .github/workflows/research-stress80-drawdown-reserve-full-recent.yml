name: research-stress80-drawdown-reserve-full-recent

on:
  push:
    branches:
      - research/stress80-post-checkpoint
    paths:
      - ".github/workflows/research-stress80-drawdown-reserve-full-recent.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  stress-full-recent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.91
      - name: Download fixed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv broad_daily_universe.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516473115/zip" -o /tmp/prior.zip
          echo "d0adcfb348c5ae89ddb488474c088d74a2402a2426c0e84fee7877dda5bd2a4e  /tmp/prior.zip" | sha256sum -c -
          unzip -j /tmp/prior.zip prior_two_year_broad_60m.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516472727/zip" -o /tmp/recent.zip
          echo "68ff2200eed8326741ce76f1cff46379c4e1dbc263297f4602bd84422e95e421  /tmp/recent.zip" | sha256sum -c -
          unzip -j /tmp/recent.zip two_year_broad_60m.csv -d runtime
      - name: Run Stress full_recent only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import sys
          sys.path.insert(0, 'tools')
          import evaluate_directional_60m_oi_confirmation as oi_gate
          import evaluate_directional_oi_freeze_cost_combo as suppress
          import evaluate_directional_oi_reversal_freeze_product_quick as reversal
          import evaluate_directional_production_mechanics as mechanics
          from afuture.directional_acceptance import ProductionMechanicsConfig
          from afuture.directional_drawdown_reserve_freeze import DrawdownReserveFreezeDirectionalProductionAcceptance

          runtime = Path('runtime')
          specific = pd.read_csv(runtime/'return_target_specific_contracts.csv')
          continuous = pd.read_csv(runtime/'broad_daily_universe.csv')
          weights = oi_gate.load_frozen_weights(runtime/'execution_aligned_weights.csv')
          bars = oi_gate.load_60m([runtime/'prior_two_year_broad_60m.csv', runtime/'two_year_broad_60m.csv'])
          close = suppress.continuous_close_panel(continuous, list(weights.columns))
          _c, _a, candidate = reversal.build_candidate_weights(base_weights=weights, bars_60m=bars, close_prices=close)
          sim = DrawdownReserveFreezeDirectionalProductionAcceptance(ProductionMechanicsConfig(initial_capital=mechanics.INITIAL_CAPITAL, margin_rate_proxy=mechanics.STRESS_MARGIN_PROXY))
          prepared = sim.prepare_contracts(specific)
          start, end = mechanics.WINDOWS['full_recent']
          result = sim.simulate(specific, candidate.loc[pd.Timestamp(start):pd.Timestamp(end)].copy(), cost_bps=mechanics.STRESS_COST_BPS, prepared=prepared)
          stats = mechanics._result_stats(result)
          payload = {'stress_full_recent': stats}
          (runtime/'stress80_drawdown_reserve_full_recent.json').write_text(json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stress80-drawdown-reserve-full-recent
          path: runtime/stress80_drawdown_reserve_full_recent.json
          retention-days: 14
      - name: Post result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          r=json.loads(Path('runtime/stress80_drawdown_reserve_full_recent.json').read_text())['stress_full_recent']
          print(f"### Stress80 drawdown-reserve full_recent early signal `{os.environ['GITHUB_RUN_ID']}`")
          print(f"\n- Stress full_recent: **{r['annualized_return']:.6%}**")
          print(f"- DD: **{r['max_drawdown']:.6%}**")
          print(f"- gross: **{r['max_realized_gross_notional_ratio']:.6f}x**")
          print(f"- halted: **{r['halted']}**, margin rejects: **{r['margin_reject_days']}**")
          PY
          gh pr comment 23 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
