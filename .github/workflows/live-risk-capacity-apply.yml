name: live-risk-capacity-apply

on:
  push:
    branches:
      - codex/live-risk-capacity
    paths:
      - .github/live-risk-capacity-apply.py
      - .github/workflows/live-risk-capacity-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/live-risk-capacity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Patch runner using unique source needles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/live-risk-capacity-apply.py')
          text = path.read_text(encoding='utf-8')

          def call_bounds(source: str, needle: str) -> tuple[int, int]:
              index = source.find(needle)
              if index < 0:
                  raise RuntimeError(f'runner needle not found: {needle}')
              start = source.rfind('replace_once(', 0, index)
              if start < 0:
                  start = source.rfind('replace_all(', 0, index)
              if start < 0:
                  raise RuntimeError(f'runner call start not found: {needle}')
              end = source.find('\n)\n', index)
              if end < 0:
                  raise RuntimeError(f'runner call end not found: {needle}')
              return start, end + 3

          signature_needle = 'bootstrap_seed_digest: str,\\n    account_identity_digest: str,\\n    operator_reason: str,\\n'
          start, end = call_bounds(text, signature_needle)
          block = text[start:end]
          if not block.startswith('replace_once('):
              raise RuntimeError('shared activation signature patch is not replace_once')
          block = block.replace('replace_once(', 'replace_all(', 1)
          block = block[:-2] + '    minimum=2,\n)\n'
          text = text[:start] + block + text[end:]

          ambiguous_needle = 'account_identity_digest=account_identity_digest,\\n            )\\n'
          start, end = call_bounds(text, ambiguous_needle)
          text = text[:start] + text[end:]

          redundant_needle = 'account_identity_digest: str,\\n    operator_reason: str,\\n    activation_confirmation: str,\\n'
          start, end = call_bounds(text, redundant_needle)
          text = text[:start] + text[end:]

          marker_needle = '"account_identity_digest": account_identity_digest,\\n        "operator_reason": operator_reason.strip(),\\n'
          start, end = call_bounds(text, marker_needle)
          marker_patch = r'''replace_once(
              "afuture/directional_policy_activation.py",
              '        "bootstrap_seed_digest": bootstrap_seed_digest,\n        "account_identity_digest": account_identity_digest,\n        "operator_reason": operator_reason.strip(),\n',
              '        "bootstrap_seed_digest": bootstrap_seed_digest,\n'
              '        "account_identity_digest": account_identity_digest,\n'
              '        "risk_overlay_digest": risk_overlay_digest,\n'
              '        "operator_reason": operator_reason.strip(),\n',
          )
          '''.replace('          ', '')
          text = text[:start] + marker_patch + text[end:]

          permit_needle = 'products_manifest_digest=STRESS90_POLICY.products_manifest_digest,\\n        bootstrap_seed_digest=seed.seed_digest,\\n'
          start, end = call_bounds(text, permit_needle)
          permit_patch = r'''replace_once(
              "afuture/stress90_activation_permit.py",
              "        policy_manifest_digest=STRESS90_POLICY.policy_manifest_digest,\n"
              "        products_manifest_digest=STRESS90_POLICY.products_manifest_digest,\n"
              "        bootstrap_seed_digest=seed.seed_digest,\n",
              "        policy_manifest_digest=STRESS90_POLICY.policy_manifest_digest,\n"
              "        products_manifest_digest=STRESS90_POLICY.products_manifest_digest,\n"
              "        bootstrap_seed_digest=seed.seed_digest,\n"
              "        risk_overlay_digest=str(\n"
              "            state.strategy_states[\"directional_policy_identity\"].get(\"risk_overlay_digest\", \"\")\n"
              "        ),\n",
          )
          '''.replace('          ', '')
          text = text[:start] + permit_patch + text[end:]

          delegate_needle = 'operation_nonce = _require_lifecycle_operation_nonce(args)\\n    shadow_account = bool(getattr(args, \\"shadow_account\\", False))\\n'
          start, end = call_bounds(text, delegate_needle)
          delegate_patch = r'''cli_text = read("afuture/cli.py")
          activate_start = cli_text.index("def _run_stress90_activate(config, args) -> int:")
          activate_end = cli_text.index("\ndef ", activate_start + 1)
          activate_block = cli_text[activate_start:activate_end]
          old_delegate = (
              "    operation_nonce = _require_lifecycle_operation_nonce(args)\n"
              "    shadow_account = bool(getattr(args, \"shadow_account\", False))\n"
          )
          new_delegate = (
              "    operation_nonce = _require_lifecycle_operation_nonce(args)\n"
              "    if _stress90_risk_overlay_reactivation_required(config, args):\n"
              "        return _run_stress90_risk_overlay_reactivation(config, args)\n"
              "    shadow_account = bool(getattr(args, \"shadow_account\", False))\n"
          )
          if activate_block.count(old_delegate) != 1:
              raise RuntimeError("Stress-90 activate delegation anchor mismatch")
          activate_block = activate_block.replace(old_delegate, new_delegate, 1)
          write(
              "afuture/cli.py",
              cli_text[:activate_start] + activate_block + cli_text[activate_end:],
          )
          '''.replace('          ', '')
          text = text[:start] + delegate_patch + text[end:]

          replacements = {
              'text.replace(anchor, textwrap.dedent(block) + anchor, 1)':
                  'text.replace(anchor, block.lstrip("\\n") + anchor, 1)',
              'text = text[:idx] + textwrap.dedent(source_block) + text[idx:]':
                  'text = text[:idx] + source_block.lstrip("\\n") + text[idx:]',
              'text = text[:idx] + textwrap.dedent(transition_block) + text[idx:]':
                  'text = text[:idx] + transition_block.lstrip("\\n") + text[idx:]',
              '    "tests/test_directional_policy_activation.py",':
                  '    "tests/test_directional_stress90_activation.py",\n    "tests/test_stress90_lifecycle_transaction.py",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'runner patch mismatch: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply TDD implementation and focused verification
        run: python .github/live-risk-capacity-apply.py
      - name: Commit verified checkpoint and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/live-risk-capacity-apply.py .github/workflows/live-risk-capacity-apply.yml
          git add -A
          git commit -m "Add Stress-90 live risk capacity controls"
          git push origin HEAD:codex/live-risk-capacity
