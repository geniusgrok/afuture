name: live-risk-capacity-apply

on:
  push:
    branches:
      - codex/live-risk-capacity
    paths:
      - .github/live-risk-capacity-apply.py
      - .github/workflows/live-risk-capacity-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/live-risk-capacity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Patch runner with exact source blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/live-risk-capacity-apply.py')
          text = path.read_text(encoding='utf-8')

          signature_old = '''replace_once(
              "afuture/directional_policy_activation.py",
              "    bootstrap_seed_digest: str,\\n    account_identity_digest: str,\\n    operator_reason: str,\\n",
              "    bootstrap_seed_digest: str,\\n    account_identity_digest: str,\\n    risk_overlay_digest: str,\\n    operator_reason: str,\\n",
          )
          '''.replace('          ', '')
          signature_new = '''replace_all(
              "afuture/directional_policy_activation.py",
              "    bootstrap_seed_digest: str,\\n    account_identity_digest: str,\\n    operator_reason: str,\\n",
              "    bootstrap_seed_digest: str,\\n    account_identity_digest: str,\\n    risk_overlay_digest: str,\\n    operator_reason: str,\\n",
              minimum=2,
          )
          '''.replace('          ', '')

          ambiguous = '''replace_once(
              "afuture/directional_policy_activation.py",
              "                account_identity_digest=account_identity_digest,\\n            )\\n",
              "                account_identity_digest=account_identity_digest,\\n"
              "                risk_overlay_digest=(\\n"
              "                    str(existing_marker.get(\\"risk_overlay_digest\\"))\\n"
              "                    if \\"risk_overlay_digest\\" in existing_marker\\n"
              "                    else None\\n"
              "                ),\\n"
              "            )\\n",
          )
          '''.replace('          ', '')

          redundant = '''replace_once(
              "afuture/directional_policy_activation.py",
              "    account_identity_digest: str,\\n    operator_reason: str,\\n    activation_confirmation: str,\\n",
              "    account_identity_digest: str,\\n    risk_overlay_digest: str,\\n    operator_reason: str,\\n    activation_confirmation: str,\\n",
          )
          '''.replace('          ', '')

          for old, new, label in (
              (signature_old, signature_new, 'shared activation signature'),
              (ambiguous, '', 'redundant marker self-check'),
              (redundant, '', 'redundant reactivation signature'),
          ):
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected one exact runner block, got {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply TDD implementation and focused verification
        run: python .github/live-risk-capacity-apply.py
      - name: Commit verified checkpoint and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/live-risk-capacity-apply.py .github/workflows/live-risk-capacity-apply.yml
          git add -A
          git commit -m "Add Stress-90 live risk capacity controls"
          git push origin HEAD:codex/live-risk-capacity
