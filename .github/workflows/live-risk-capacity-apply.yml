name: live-risk-capacity-apply

on:
  push:
    branches:
      - codex/live-risk-capacity
    paths:
      - .github/live-risk-capacity-apply.py
      - .github/workflows/live-risk-capacity-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/live-risk-capacity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Patch runner using unique source needles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/live-risk-capacity-apply.py')
          text = path.read_text(encoding='utf-8')

          def call_bounds(source: str, needle: str) -> tuple[int, int]:
              index = source.find(needle)
              if index < 0:
                  raise RuntimeError(f'runner needle not found: {needle}')
              start = source.rfind('replace_once(', 0, index)
              if start < 0:
                  start = source.rfind('replace_all(', 0, index)
              if start < 0:
                  raise RuntimeError(f'runner call start not found: {needle}')
              end = source.find('\n)\n', index)
              if end < 0:
                  raise RuntimeError(f'runner call end not found: {needle}')
              return start, end + 3

          signature_needle = 'bootstrap_seed_digest: str,\\n    account_identity_digest: str,\\n    operator_reason: str,\\n'
          start, end = call_bounds(text, signature_needle)
          block = text[start:end]
          if not block.startswith('replace_once('):
              raise RuntimeError('shared activation signature patch is not replace_once')
          block = block.replace('replace_once(', 'replace_all(', 1)
          block = block[:-2] + '    minimum=2,\n)\n'
          text = text[:start] + block + text[end:]

          ambiguous_needle = 'account_identity_digest=account_identity_digest,\\n            )\\n'
          start, end = call_bounds(text, ambiguous_needle)
          text = text[:start] + text[end:]

          redundant_needle = 'account_identity_digest: str,\\n    operator_reason: str,\\n    activation_confirmation: str,\\n'
          start, end = call_bounds(text, redundant_needle)
          text = text[:start] + text[end:]

          marker_needle = '"account_identity_digest": account_identity_digest,\\n        "operator_reason": operator_reason.strip(),\\n'
          start, end = call_bounds(text, marker_needle)
          marker_patch = r'''replace_once(
              "afuture/directional_policy_activation.py",
              '        "bootstrap_seed_digest": bootstrap_seed_digest,\n        "account_identity_digest": account_identity_digest,\n        "operator_reason": operator_reason.strip(),\n',
              '        "bootstrap_seed_digest": bootstrap_seed_digest,\n'
              '        "account_identity_digest": account_identity_digest,\n'
              '        "risk_overlay_digest": risk_overlay_digest,\n'
              '        "operator_reason": operator_reason.strip(),\n',
          )
          '''.replace('          ', '')
          text = text[:start] + marker_patch + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply TDD implementation and focused verification
        run: python .github/live-risk-capacity-apply.py
      - name: Commit verified checkpoint and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/live-risk-capacity-apply.py .github/workflows/live-risk-capacity-apply.yml
          git add -A
          git commit -m "Add Stress-90 live risk capacity controls"
          git push origin HEAD:codex/live-risk-capacity
