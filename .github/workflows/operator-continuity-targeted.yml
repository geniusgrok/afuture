name: operator-continuity-targeted

on:
  push:
    branches:
      - codex/operator-managed-continuity

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff mypy
      - name: Apply development patch when present
        run: |
          if [ -f tools/operator_continuity_patch.py ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path("tools/operator_continuity_patch.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("    if new in text:\n", "    if new and new in text:\n", 1)
          path.write_text(text, encoding="utf-8")
          PY
            python tools/operator_continuity_patch.py
          fi
      - name: Targeted tests
        run: |
          if [ -f tests/test_stress90_operator_continuity.py ]; then
            python -m pytest -q \
              tests/test_stress90_operator_continuity.py \
              tests/test_directional_config_risk.py \
              tests/test_trading_day_evidence.py \
              tests/test_account_runtime_registry.py \
              tests/test_stress90_lifecycle_transaction.py \
              tests/test_stress90_activation_permit.py
          else
            echo "operator continuity RED tests not added yet"
          fi
      - name: Targeted quality
        run: |
          if [ -f afuture/stress90_operator_continuity.py ]; then
            python -m ruff check --fix afuture/stress90_operator_continuity.py tests/test_stress90_operator_continuity.py
            python -m ruff check afuture/stress90_operator_continuity.py tests/test_stress90_operator_continuity.py
            python -m mypy afuture/stress90_operator_continuity.py
          fi
      - name: Commit generated implementation
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: add operator-managed account continuity"
            git push origin HEAD:codex/operator-managed-continuity
          fi
