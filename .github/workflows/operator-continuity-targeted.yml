name: operator-continuity-targeted

on:
  push:
    branches:
      - codex/operator-managed-continuity

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Apply staged implementation
        run: |
          python tools/operator_continuity_patch.py
          python -m ruff format afuture/stress90_operator_continuity.py tests/test_stress90_operator_continuity.py tests/test_stress90_operator_roll_forward.py
      - name: Targeted tests
        run: |
          python -m pytest -q \
            tests/test_stress90_operator_continuity.py \
            tests/test_stress90_operator_roll_forward.py \
            tests/test_directional_config_risk.py \
            tests/test_trading_day_evidence.py \
            tests/test_account_runtime_registry.py \
            tests/test_stress90_lifecycle_transaction.py \
            tests/test_stress90_activation_permit.py
      - name: Targeted quality
        run: |
          python -m ruff check afuture/stress90_operator_continuity.py tests/test_stress90_operator_continuity.py tests/test_stress90_operator_roll_forward.py
          python -m ruff format --check afuture/stress90_operator_continuity.py tests/test_stress90_operator_continuity.py tests/test_stress90_operator_roll_forward.py
          python -m mypy afuture/stress90_operator_continuity.py
      - name: Commit generated implementation checkpoint
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afuture/stress90_operator_continuity.py afuture/cli.py tests/test_stress90_operator_continuity.py tests/test_stress90_operator_roll_forward.py
          git commit -m "feat: add operator roll-forward continuity boundary"
          git push origin HEAD:codex/operator-managed-continuity
