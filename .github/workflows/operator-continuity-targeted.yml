name: operator-continuity-targeted

on:
  push:
    branches:
      - codex/operator-managed-continuity

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore permanent CI and remove development-only files
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/operator-continuity-targeted.yml
          rm -f tools/operator_continuity_*.py
          git diff --check
          if find docs -path '*/superpowers/*' -type f -newer .git/HEAD 2>/dev/null | grep -q .; then
            echo "unexpected temporary Superpowers docs" >&2
            exit 1
          fi
      - name: Commit final candidate cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: restore permanent validation surface"
          git push origin HEAD:codex/operator-managed-continuity
