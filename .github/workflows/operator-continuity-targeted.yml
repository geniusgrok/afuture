name: operator-continuity-targeted

on:
  push:
    branches:
      - codex/operator-managed-continuity

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Targeted tests
        run: |
          python -m pytest -q \
            tests/test_stress90_operator_continuity.py \
            tests/test_stress90_operator_roll_forward.py \
            tests/test_stress90_operator_roll_forward_plan.py \
            tests/test_stress90_operator_permit.py \
            tests/test_stress90_operator_status.py \
            tests/test_stress90_operator_rebase_reanchor.py \
            tests/test_directional_config_risk.py \
            tests/test_trading_day_evidence.py \
            tests/test_account_runtime_registry.py \
            tests/test_stress90_lifecycle_transaction.py \
            tests/test_stress90_activation_permit.py \
            tests/test_directional_stress90_activation.py \
            tests/test_operations.py \
            tests/test_cli_safety.py \
            tests/test_cli_runtime_factory.py
      - name: Targeted quality
        run: |
          python -m ruff check afuture/stress90_operator_continuity.py afuture/stress90_activation_permit.py afuture/runtime_factory.py afuture/operations.py afuture/cli.py tests/test_stress90_operator_continuity.py tests/test_stress90_operator_roll_forward.py tests/test_stress90_operator_roll_forward_plan.py tests/test_stress90_operator_permit.py tests/test_stress90_operator_status.py tests/test_stress90_operator_rebase_reanchor.py
          python -m ruff format --check afuture/stress90_operator_continuity.py afuture/stress90_activation_permit.py afuture/runtime_factory.py afuture/operations.py afuture/cli.py tests/test_stress90_operator_continuity.py tests/test_stress90_operator_roll_forward.py tests/test_stress90_operator_roll_forward_plan.py tests/test_stress90_operator_permit.py tests/test_stress90_operator_status.py tests/test_stress90_operator_rebase_reanchor.py
          python -m mypy afuture/stress90_operator_continuity.py afuture/stress90_activation_permit.py afuture/runtime_factory.py afuture/operations.py afuture/cli.py
          python -m compileall -q afuture
