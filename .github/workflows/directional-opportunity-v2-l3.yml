name: directional-opportunity-v2-l3

on:
  push:
    branches:
      - codex/afuture-opportunity-selector-v2-20260824
    paths:
      - .github/workflows/directional-opportunity-v2-l3.yml

permissions:
  contents: read
  actions: read

jobs:
  fixed-l3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,live]"
      - name: Download frozen PR17 input artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip > fixed-l3-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  fixed-l3-input.zip" | sha256sum -c -
          mkdir -p fixed runtime
          unzip -q fixed-l3-input.zip -d fixed
          cp fixed/broad_daily_universe.csv runtime/broad_daily_universe.csv
          cp fixed/return_target_specific_contracts.csv runtime/return_target_specific_contracts.csv
      - name: Targeted opportunity tests
        run: >-
          python -m pytest -q
          tests/test_directional_opportunity.py
          tests/test_directional_opportunity_integration.py
      - name: Compile affected modules
        run: >-
          python -m compileall -q
          afuture/directional_opportunity.py
          afuture/opportunity_aligned_policy.py
          afuture/opportunity_aligned_runtime.py
          afuture/directional_opportunity_lineage.py
      - name: Run fixed float and Production mechanics
        run: |
          python tools/evaluate_opportunity_aligned_target.py
          python tools/evaluate_directional_opportunity_production.py
      - name: Summarize frozen candidate without retuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          float_report = json.loads(Path("runtime/opportunity_directional_target_report.json").read_text())
          production = json.loads(Path("runtime/opportunity_production_mechanics_report.json").read_text())
          base = production["base"]["windows"]["full_recent"]
          stress = production["stress"]["windows"]["full_recent"]
          base_oos = production["base"]["windows"]["oos"]
          stress_oos = production["stress"]["windows"]["oos"]
          attr = production["production_attribution"]["stress"]
          result = {
              "baseline": {
                  "base_annualized": 1.0906361799188824,
                  "stress_annualized": 0.2895586436150601,
                  "stress_max_drawdown": -0.2811516529064918,
                  "stress_sharpe": 0.9603659973923214,
                  "stress_turnover_notional": 256918290.0,
              },
              "candidate": {
                  "base_full_recent": base,
                  "stress_full_recent": stress,
                  "base_oos": base_oos,
                  "stress_oos": stress_oos,
                  "stress_turnover_notional": attr.get("total_turnover_notional", 0.0),
                  "stress_transaction_cost": attr.get("total_transaction_cost", 0.0),
                  "stress_gross_signal_pnl": attr.get("gross_signal_pnl", 0.0),
              },
              "float": {
                  "base_full_recent": float_report["next_open_execution"]["base"]["full_recent"],
                  "stress_full_recent": float_report["next_open_execution"]["stress"]["full_recent"],
                  "base_oos": float_report["next_open_execution"]["base"]["oos"],
                  "stress_oos": float_report["next_open_execution"]["stress"]["oos"],
              },
              "gate": {
                  "base_not_worse": base["annualized_return"] >= 1.0906361799188824,
                  "stress_improved": stress["annualized_return"] > 0.2895586436150601,
                  "stress_sharpe_not_worse": stress["sharpe"] >= 0.9603659973923214,
                  "stress_dd_not_worse": stress["max_drawdown"] >= -0.2811516529064918,
                  "no_halt": not production["stress"]["halted"],
                  "zero_margin_rejects": production["stress"]["margin_reject_days"] == 0,
                  "gross_within_2x": production["stress"]["max_realized_gross_notional_ratio"] <= 2.0 + 1e-10,
              },
          }
          Path("runtime/opportunity_v2_gate_summary.json").write_text(
              json.dumps(result, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload fixed L3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-opportunity-v2-fixed-l3
          path: |
            runtime/opportunity_directional_target_report.json
            runtime/opportunity_directional_weights.csv
            runtime/opportunity_directional_specific_selection.csv
            runtime/opportunity_production_mechanics_report.json
            runtime/opportunity_production_base_daily.csv
            runtime/opportunity_production_stress_daily.csv
            runtime/opportunity_production_base_events.csv
            runtime/opportunity_production_stress_events.csv
            runtime/opportunity_v2_gate_summary.json
          if-no-files-found: warn
