name: research-stress80-shadow-mpv-l3

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-shadow-mpv-l3.yml"
      - "afuture/directional_shadow_outcomes.py"
      - "afuture/directional_shadow_mpv_robustness.py"
      - "tools/evaluate_directional_shadow_mpv.py"
      - "tests/test_directional_shadow_outcomes.py"
      - "tests/test_directional_shadow_mpv_robustness.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-shadow-mpv-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download fixed specific-contract input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime
      - name: Download validated baseline weights
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime
      - name: Verify Shadow outcome and adapter semantics
        run: >-
          python -m pytest -q
          tests/test_directional_shadow_outcomes.py
          tests/test_directional_shadow_mpv_robustness.py
      - name: Run fixed Shadow MPV Production L3
        run: python tools/evaluate_directional_shadow_mpv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-shadow-mpv-l3
          path: runtime/shadow_mpv_production_report.json
          retention-days: 14
      - name: Post Shadow MPV result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/shadow-comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 Shadow MPV Production L3 `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/shadow_mpv_production_report.json")
          if not path.exists():
              print("\nNo report was produced; inspect targeted test/evaluator failure before economic interpretation.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"\n- baseline reproduction: **{report['baseline_reproduction']}**")
              if not report.get('candidate'):
                  print(f"- candidate evaluated: **False**; reason={report.get('reason')}")
              else:
                  shadow = report['shadow']
                  print(f"- shadow outcomes: **{shadow['rows']} rows / {shadow['products']} products**, {shadow['first']}..{shadow['last']}")
                  print(f"- fixed objective cost: **{shadow['objective_cost_bps']:.1f} bp one-way**")
                  candidate = report['candidate']
                  base = candidate['base']['windows']
                  stress = candidate['stress']['windows']
                  print(f"- Production Base full_recent: **{base['full_recent']['annualized_return']:.6%}**, DD {base['full_recent']['max_drawdown']:.6%}")
                  print(f"- Production Stress full_recent: **{stress['full_recent']['annualized_return']:.6%}**, DD {stress['full_recent']['max_drawdown']:.6%}")
                  print(f"- Production Stress validation: **{stress['validation']['annualized_return']:.6%}**, DD {stress['validation']['max_drawdown']:.6%}")
                  print(f"- Production Stress OOS: **{stress['oos']['annualized_return']:.6%}**, DD {stress['oos']['max_drawdown']:.6%}")
                  print(f"- Stress gross peak: **{stress['full_recent']['max_realized_gross_notional_ratio']:.6f}x**")
                  print(f"- Stress halted: **{stress['full_recent']['halted']}**")
                  econ = report['economics']['stress']
                  print(f"- Stress turnover: **{econ['turnover_notional']:.2f}**")
                  print(f"- Stress net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
                  gate = report['promotion_gate']
                  print(f"- Stress80 promotion gate: **{gate['passed']}**")
                  if gate['reasons']:
                      print("- failed gates: " + ", ".join(gate['reasons']))
          PY
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/shadow-comment.md
