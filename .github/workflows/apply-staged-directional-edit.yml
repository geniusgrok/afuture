name: apply-staged-directional-edit

on:
  push:
    branches:
      - codex/afuture-stress-80-efficiency-20260823
    paths:
      - .github/scripts/staged_directional_edit.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/afuture-stress-80-efficiency-20260823
          fetch-depth: 0
      - name: Apply asserted edit
        run: python .github/scripts/staged_directional_edit.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Targeted directional gate
        run: >-
          python -m pytest -q
          tests/test_directional_execution_efficiency.py
          tests/test_directional_same_direction_integration.py
          tests/test_execution_aligned_policy.py
          tests/test_directional_activity.py
          tests/test_directional_trading_day_selection.py
          tests/test_directional_stress_robustness.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_acceptance.py
          tests/test_directional_acceptance_simulation.py
          tests/test_directional_review_regressions.py
      - run: python -m compileall -q afuture
      - name: Commit only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          message=$(sed -n 's/^# message: //p' .github/scripts/staged_directional_edit.py | head -n1)
          test -n "$message"
          git rm .github/scripts/staged_directional_edit.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git push origin HEAD:codex/afuture-stress-80-efficiency-20260823
