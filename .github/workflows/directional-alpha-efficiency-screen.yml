name: directional-alpha-efficiency-screen

on:
  pull_request:
    paths:
      - .github/workflows/directional-alpha-efficiency-screen.yml

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install screen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "akshare>=1.17"
      - name: Download frozen PR17 input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip > fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  fixed-input.zip" | sha256sum -c -
          mkdir -p fixed runtime
          unzip -q fixed-input.zip -d fixed
          cp fixed/broad_daily_universe.csv runtime/
          cp fixed/return_target_specific_contracts.csv runtime/
      - name: Targeted selector tests
        run: python -m pytest -q tests/test_directional_alpha_efficiency.py
      - name: Run baseline and Candidate B float screens
        run: |
          python tools/evaluate_execution_aligned_target.py
          cp runtime/execution_aligned_target_report.json runtime/alpha_efficiency_baseline_report.json
          python tools/evaluate_alpha_efficiency_target.py
      - name: Compare every evidence window
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("runtime/alpha_efficiency_baseline_report.json").read_text())
          cand = json.loads(Path("runtime/alpha_efficiency_target_report.json").read_text())
          windows = ["prior1", "prior2", "train", "validation", "oos", "full_recent"]
          summary = {"windows": {}, "gate": {}}
          for window in windows:
              row = {}
              for endpoint in ("base", "stress"):
                  b = base["next_open_execution"][endpoint][window]
                  c = cand["next_open_execution"][endpoint][window]
                  row[endpoint] = {
                      "baseline_annualized": b["annualized_return"],
                      "candidate_annualized": c["annualized_return"],
                      "delta_pp": (c["annualized_return"] - b["annualized_return"]) * 100.0,
                      "baseline_sharpe": b["sharpe"],
                      "candidate_sharpe": c["sharpe"],
                      "baseline_max_drawdown": b["max_drawdown"],
                      "candidate_max_drawdown": c["max_drawdown"],
                  }
              summary["windows"][window] = row
          bf = summary["windows"]["full_recent"]["base"]
          sf = summary["windows"]["full_recent"]["stress"]
          bo = summary["windows"]["oos"]["base"]
          so = summary["windows"]["oos"]["stress"]
          summary["gate"] = {
              "full_base_improved": bf["candidate_annualized"] > bf["baseline_annualized"],
              "full_stress_improved": sf["candidate_annualized"] > sf["baseline_annualized"],
              "oos_base_not_worse": bo["candidate_annualized"] >= bo["baseline_annualized"],
              "oos_stress_not_worse": so["candidate_annualized"] >= so["baseline_annualized"],
              "stress_prior1_not_worse": summary["windows"]["prior1"]["stress"]["delta_pp"] >= -1.0,
              "stress_prior2_not_worse": summary["windows"]["prior2"]["stress"]["delta_pp"] >= -1.0,
              "stress_train_not_worse": summary["windows"]["train"]["stress"]["delta_pp"] >= -1.0,
          }
          Path("runtime/alpha_efficiency_screen_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if not all(summary["gate"].values()):
              raise SystemExit("Candidate B failed the predeclared cheap screen; Production L3 is not justified")
          PY
      - name: Run exactly one fixed Production L3 for Candidate B
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          import pandas as pd

          sys.path.insert(0, "tools")
          import evaluate_alpha_efficiency_target as alpha_target
          import evaluate_directional_production_mechanics as mechanics

          runtime = Path("runtime")
          specific = pd.read_csv(runtime / "return_target_specific_contracts.csv")
          continuous = pd.read_csv(runtime / "broad_daily_universe.csv")

          # Recompute the PR17 baseline and Candidate B from the same frozen inputs.
          # This is the one Production-mechanics gate for Candidate B; no parameter
          # changes are permitted after this result.
          baseline = mechanics.evaluate(specific, continuous)
          weights = alpha_target.generate_alpha_efficiency_weights(continuous)
          historical = alpha_target.evaluate(specific, continuous)
          candidate = mechanics.evaluate_with_weights(
              specific,
              weights,
              float_report=historical,
          )
          candidate["role"] = "production-mechanics proxy acceptance for product alpha-efficiency Candidate B"
          candidate["selection_frozen"] = True
          candidate["parameter_search"] = False
          candidate["strategy_version"] = "product_alpha_efficiency_candidate_b"

          def jsonable(report):
              return {key: value for key, value in report.items() if not key.startswith("_")}

          (runtime / "alpha_efficiency_baseline_production_report.json").write_text(
              json.dumps(jsonable(baseline), indent=2, sort_keys=True), encoding="utf-8"
          )
          (runtime / "alpha_efficiency_production_report.json").write_text(
              json.dumps(jsonable(candidate), indent=2, sort_keys=True), encoding="utf-8"
          )
          candidate["_base_daily"].to_csv(runtime / "alpha_efficiency_production_base_daily.csv")
          candidate["_stress_daily"].to_csv(runtime / "alpha_efficiency_production_stress_daily.csv")
          candidate["_base_events"].to_csv(runtime / "alpha_efficiency_production_base_events.csv", index=False)
          candidate["_stress_events"].to_csv(runtime / "alpha_efficiency_production_stress_events.csv", index=False)

          windows = ["prior1", "prior2", "train", "validation", "oos", "full_recent"]
          comparison = {"windows": {}, "gate": {}, "efficiency": {}}
          for window in windows:
              comparison["windows"][window] = {}
              for endpoint in ("base", "stress"):
                  b = baseline[endpoint]["windows"][window]
                  c = candidate[endpoint]["windows"][window]
                  comparison["windows"][window][endpoint] = {
                      "baseline_annualized": b["annualized_return"],
                      "candidate_annualized": c["annualized_return"],
                      "delta_pp": (c["annualized_return"] - b["annualized_return"]) * 100.0,
                      "baseline_sharpe": b["sharpe"],
                      "candidate_sharpe": c["sharpe"],
                      "baseline_max_drawdown": b["max_drawdown"],
                      "candidate_max_drawdown": c["max_drawdown"],
                      "baseline_halted": b["halted"],
                      "candidate_halted": c["halted"],
                      "baseline_margin_reject_days": b["margin_reject_days"],
                      "candidate_margin_reject_days": c["margin_reject_days"],
                  }

          bf = comparison["windows"]["full_recent"]["base"]
          sf = comparison["windows"]["full_recent"]["stress"]
          bo = comparison["windows"]["oos"]["base"]
          so = comparison["windows"]["oos"]["stress"]

          no_new_halt = all(
              (not comparison["windows"][window][endpoint]["candidate_halted"])
              or comparison["windows"][window][endpoint]["baseline_halted"]
              for window in windows
              for endpoint in ("base", "stress")
          )
          no_new_margin_reject = all(
              comparison["windows"][window][endpoint]["candidate_margin_reject_days"]
              <= comparison["windows"][window][endpoint]["baseline_margin_reject_days"]
              for window in windows
              for endpoint in ("base", "stress")
          )

          comparison["gate"] = {
              "full_base_not_worse": bf["candidate_annualized"] >= bf["baseline_annualized"],
              "full_stress_improved": sf["candidate_annualized"] > sf["baseline_annualized"],
              "full_stress_sharpe_not_worse": sf["candidate_sharpe"] >= sf["baseline_sharpe"],
              "full_stress_drawdown_not_worse": sf["candidate_max_drawdown"] >= sf["baseline_max_drawdown"],
              "oos_base_not_worse": bo["candidate_annualized"] >= bo["baseline_annualized"],
              "oos_stress_not_worse": so["candidate_annualized"] >= so["baseline_annualized"],
              "stress_prior1_not_worse_by_1pp": comparison["windows"]["prior1"]["stress"]["delta_pp"] >= -1.0,
              "stress_prior2_not_worse_by_1pp": comparison["windows"]["prior2"]["stress"]["delta_pp"] >= -1.0,
              "stress_train_not_worse_by_1pp": comparison["windows"]["train"]["stress"]["delta_pp"] >= -1.0,
              "no_new_halt": no_new_halt,
              "no_new_margin_reject": no_new_margin_reject,
              "stress_gross_within_2x": candidate["stress"]["max_realized_gross_notional_ratio"] <= 2.0 + 1e-10,
              "base_gross_within_2x": candidate["base"]["max_realized_gross_notional_ratio"] <= 2.0 + 1e-10,
          }

          for label, report in (("baseline", baseline), ("candidate", candidate)):
              attr = report["production_attribution"]["stress"]
              turnover = float(attr["transaction_cost"]["turnover_notional"])
              gross_pnl = float(attr["alpha"]["gross_signal_pnl"])
              cost = float(attr["transaction_cost"]["total_cost"])
              comparison["efficiency"][label] = {
                  "stress_turnover_notional": turnover,
                  "stress_gross_signal_pnl": gross_pnl,
                  "stress_transaction_cost": cost,
                  "stress_net_alpha_pnl": gross_pnl - cost,
                  "stress_net_alpha_per_turnover_bps": ((gross_pnl - cost) / turnover * 10000.0) if turnover > 0 else 0.0,
              }

          (runtime / "alpha_efficiency_production_gate_summary.json").write_text(
              json.dumps(comparison, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(comparison, indent=2, sort_keys=True))
          if not all(comparison["gate"].values()):
              raise SystemExit("Candidate B failed the frozen Production L3; do not tune or promote it")
          PY
      - name: Upload Candidate B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-alpha-efficiency-screen
          path: |
            runtime/alpha_efficiency_baseline_report.json
            runtime/alpha_efficiency_target_report.json
            runtime/alpha_efficiency_screen_summary.json
            runtime/alpha_efficiency_weights.csv
            runtime/alpha_efficiency_baseline_production_report.json
            runtime/alpha_efficiency_production_report.json
            runtime/alpha_efficiency_production_gate_summary.json
            runtime/alpha_efficiency_production_base_daily.csv
            runtime/alpha_efficiency_production_stress_daily.csv
            runtime/alpha_efficiency_production_base_events.csv
            runtime/alpha_efficiency_production_stress_events.csv
          if-no-files-found: warn
