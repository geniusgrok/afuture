name: research-basis-alpha

# Temporary one-shot new-information Alpha screen. Remove after evidence is recorded.
on:
  pull_request:
    paths:
      - .github/workflows/research-basis-alpha.yml
      - afuture/directional_basis_alpha.py
      - tests/test_directional_basis_alpha.py
      - tools/fetch_directional_basis_history.py
      - tools/evaluate_directional_basis_alpha.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-basis-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install "akshare==1.18.84"

      - name: Targeted causal basis tests
        run: python -m pytest -q tests/test_directional_basis_alpha.py

      - name: Download exact frozen Production input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/production-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/production-input.zip" | sha256sum -c -
          unzip -q /tmp/production-input.zip -d runtime

      - name: Fetch bounded historical basis panel
        run: python tools/fetch_directional_basis_history.py > runtime/directional_basis_fetch.log

      - name: Run predeclared basis Alpha screen
        run: python tools/evaluate_directional_basis_alpha.py > runtime/directional_basis_alpha.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-basis-alpha-evidence
          path: |
            runtime/directional_basis_history.csv
            runtime/directional_basis_fetch.log
            runtime/directional_basis_alpha_report.json
            runtime/directional_basis_alpha.log
          retention-days: 14
