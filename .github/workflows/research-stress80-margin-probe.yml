name: research-stress80-margin-probe

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-margin-probe.yml"
      - "tools/probe_directional_settlement_margin.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-margin-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.91
      - name: Download frozen directional inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip broad_daily_universe.csv return_target_specific_contracts.csv -d runtime
      - name: Probe point-in-time exchange settlement margins
        run: python tools/probe_directional_settlement_margin.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-settlement-margin-probe
          path: runtime/settlement_margin_probe.json
          retention-days: 14
      - name: Post margin coverage result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/margin-comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 settlement-margin probe `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/settlement_margin_probe.json")
          if not path.exists():
              print("\nProbe did not produce a report; inspect workflow failure before any capacity interpretation.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"\n- AKShare: `{report['akshare_version']}`")
              print(f"- API: `{report['api']}`; DCE supported: **{report['dce_supported_by_api']}**")
              for market, summary in report["summary"].items():
                  exact = summary["min_exact_symbol_coverage"]
                  exact_text = "n/a" if exact is None else f"{exact:.2%}"
                  print(
                      f"- {market}: **{summary['ok']}/{summary['attempts']} calls**, "
                      f"min product coverage **{summary['min_product_coverage']:.2%}**, "
                      f"min exact-symbol coverage **{exact_text}**, errors={summary['errors']}"
                  )
              print(f"- unsupported/fallback exchanges: `{report['unsupported_exchange_products']}`")
              print(f"- candidate boundary: {report['candidate_if_coverage_passes']}")
          PY
          gh pr comment 21 --body-file /tmp/margin-comment.md
