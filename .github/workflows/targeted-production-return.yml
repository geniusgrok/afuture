name: targeted-production-return

on:
  push:
    branches:
      - codex/afuture-production-return-100-20260823
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  targeted:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/afuture-production-return-100-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Directional L2 regression
        run: >-
          python -m pytest -q
          tests/test_directional_risk_governor.py
          tests/test_directional_daily_recovery.py
          tests/test_execution_aligned_policy.py
          tests/test_directional_activity.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_manager.py
          tests/test_directional_engine.py
          tests/test_directional_restart.py
          tests/test_directional_surface.py
          tests/test_directional_acceptance.py
          tests/test_directional_acceptance_simulation.py
          tests/test_directional_review_regressions.py
          tests/test_directional_trading_day_selection.py
      - run: python -m compileall -q afuture
      - run: python tools/test_directional_production_mechanics.py
      - name: Validate directional live example
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
        run: afuture validate --config config/afuture.directional-live.example.toml
