name: targeted-production-return

on:
  push:
    branches:
      - codex/afuture-production-return-100-20260823
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  targeted:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/afuture-production-return-100-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Directional L2 regression
        run: >-
          python -m pytest -q
          tests/test_directional_risk_governor.py
          tests/test_directional_daily_recovery.py
          tests/test_execution_aligned_policy.py
          tests/test_directional_activity.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_manager.py
          tests/test_directional_engine.py
          tests/test_directional_restart.py
          tests/test_directional_surface.py
          tests/test_directional_acceptance.py
          tests/test_directional_acceptance_simulation.py
          tests/test_directional_review_regressions.py
          tests/test_directional_trading_day_selection.py
      - run: python -m compileall -q afuture
      - run: python tools/test_directional_production_mechanics.py
      - name: Validate directional live example
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
        run: afuture validate --config config/afuture.directional-live.example.toml

  headroom-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/afuture-production-return-100-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Download frozen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/specific
          gh api /repos/${{ github.repository }}/actions/artifacts/9473260618/zip > /tmp/specific.zip
          unzip -q /tmp/specific.zip -d /tmp/specific
          test -s /tmp/specific/return_target_specific_contracts.csv
          test -s /tmp/specific/broad_daily_universe.csv
      - name: Probe fixed production headroom frontier
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          import afuture.directional_risk as directional_risk
          from afuture.directional_acceptance import DirectionalProductionAcceptance, ProductionMechanicsConfig
          from afuture.directional_risk import DirectionalRiskGovernor
          from afuture.execution_aligned_policy import ExecutionAlignedAggressivePolicy
          from afuture.execution_aligned_runtime import FROZEN_PRODUCTS
          from tools.evaluate_directional_production_mechanics import _result_stats

          specific = pd.read_csv('/tmp/specific/return_target_specific_contracts.csv')
          continuous = pd.read_csv('/tmp/specific/broad_daily_universe.csv')
          continuous['date'] = pd.to_datetime(continuous['date'], errors='coerce')
          continuous['product'] = continuous['product'].astype(str).str.upper()
          for column in ('open', 'close'):
              continuous[column] = pd.to_numeric(continuous[column], errors='coerce')
          continuous = continuous.dropna(subset=['date', 'product', 'open', 'close'])
          continuous = continuous[(continuous['open'] > 0) & (continuous['close'] > 0)]
          continuous = continuous.drop_duplicates(['date', 'product'], keep='last')

          products = tuple(FROZEN_PRODUCTS)
          open_prices = continuous.pivot(index='date', columns='product', values='open').sort_index().reindex(columns=products)
          close = continuous.pivot(index='date', columns='product', values='close').sort_index().reindex(index=open_prices.index, columns=products)
          weights = ExecutionAlignedAggressivePolicy(products=products).weight_history(open_prices, close)
          weights = weights.loc['2024-08-21':'2026-08-20']

          config = ProductionMechanicsConfig(
              max_contract_volume=35,
              max_daily_loss_ratio=0.05,
              max_total_drawdown_ratio=0.30,
              max_margin_ratio=0.35,
              min_available_ratio=0.25,
          )
          prepared = DirectionalProductionAcceptance(config).prepare_contracts(specific)
          rows = []
          for scale in (0.95, 0.96, 0.97, 0.98, 0.99, 1.00):
              directional_risk.PRODUCTION_GROSS_HEADROOM_SCALE = scale
              sim = DirectionalProductionAcceptance(config)
              sim.risk_governor = DirectionalRiskGovernor()
              result = sim.simulate(specific, weights, cost_bps=5.0, prepared=prepared)
              stats = _result_stats(result)
              row = {
                  'headroom_scale': scale,
                  'annualized_return': stats['annualized_return'],
                  'total_return': stats['total_return'],
                  'max_drawdown': stats['max_drawdown'],
                  'sharpe': stats['sharpe'],
                  'halted': stats['halted'],
                  'daily_circuit_days': stats['daily_circuit_days'],
                  'margin_reject_days': stats['margin_reject_days'],
                  'max_realized_gross_notional_ratio': stats['max_realized_gross_notional_ratio'],
              }
              rows.append(row)
              print('HEADROOM', json.dumps(row, sort_keys=True))

          eligible = [
              row for row in rows
              if not row['halted']
              and row['max_drawdown'] >= -0.30
              and row['max_realized_gross_notional_ratio'] <= 2.0 + 1e-10
          ]
          eligible.sort(key=lambda row: (row['annualized_return'], row['sharpe']), reverse=True)
          above_target = [row for row in eligible if row['annualized_return'] >= 1.0]
          print('HEADROOM_ELIGIBLE', json.dumps(eligible, sort_keys=True))
          print('HEADROOM_ABOVE_TARGET', json.dumps(above_target, sort_keys=True))
          assert eligible, 'no fixed headroom candidate satisfies production hard gates'
          PY
