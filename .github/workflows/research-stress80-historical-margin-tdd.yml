name: research-stress80-historical-margin-tdd

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-historical-margin-tdd.yml"
      - "afuture/directional_acceptance.py"
      - "afuture/directional_robustness.py"
      - "afuture/directional_historical_margin.py"
      - "tests/test_directional_historical_margin.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Historical margin focused test
        id: focused
        continue-on-error: true
        run: python -m pytest -q tests/test_directional_historical_margin.py
      - name: Post focused result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
        shell: bash
        run: |
          cat > /tmp/comment.md <<EOF
          ### Stress80 historical-margin TDD \`${GITHUB_RUN_ID}\`

          - focused test outcome: **${FOCUSED_OUTCOME}**
          - head: \`${GITHUB_SHA}\`
          EOF
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Preserve test failure as job failure
        if: steps.focused.outcome != 'success'
        run: exit 1
