name: research-stress80-inventory99-probe

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-inventory99-probe.yml"
      - "tools/probe_directional_inventory99.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-inventory99-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download frozen directional inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip broad_daily_universe.csv return_target_specific_contracts.csv -d runtime
      - name: Audit full-history inventory coverage
        run: python tools/probe_directional_inventory99.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-inventory99-probe
          path: runtime/inventory99_probe.json
          retention-days: 14
      - name: Post inventory coverage result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/inventory99-comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 inventory99 coverage probe `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/inventory99_probe.json")
          if not path.exists():
              print("\nProbe did not produce a report; inspect workflow failure before source interpretation.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"\n- successful products: **{report['products_successful']}/{report['products_attempted']}**")
              print(f"- full study-range products: **{report['products_covering_full_study_range']}**")
              print(f"- full-range list: `{report['full_range_products']}`")
              print(f"- exchange-native: **{report['exchange_native']}**")
              print(f"- historical publication timestamps: **{report['historical_publication_timestamps_available']}**")
          PY
          gh pr comment 21 --body-file /tmp/inventory99-comment.md
