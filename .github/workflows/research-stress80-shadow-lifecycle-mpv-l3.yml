name: research-stress80-shadow-lifecycle-mpv-l3

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-shadow-lifecycle-mpv-l3.yml"
      - "afuture/directional_shadow_lifecycle.py"
      - "afuture/directional_shadow_outcomes.py"
      - "afuture/directional_shadow_mpv_robustness.py"
      - "tests/test_directional_shadow_lifecycle.py"
      - "tests/test_directional_shadow_outcomes.py"
      - "tests/test_directional_shadow_mpv_robustness.py"
      - "tools/evaluate_directional_shadow_lifecycle_mpv.py"
      - "tools/evaluate_directional_shadow_lifecycle_mpv_quick.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-shadow-lifecycle-mpv-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download fixed specific-contract input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime
      - name: Download validated baseline weights
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime
      - name: Verify lifecycle Shadow causality and adapter semantics
        run: >-
          python -m pytest -q
          tests/test_directional_shadow_lifecycle.py
          tests/test_directional_shadow_outcomes.py
          tests/test_directional_shadow_mpv_robustness.py
      - name: Run minimal full_recent lifecycle Shadow gate
        id: quick
        shell: bash
        run: |
          python tools/evaluate_directional_shadow_lifecycle_mpv_quick.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          report = json.load(open("runtime/shadow_lifecycle_mpv_quick_report.json", encoding="utf-8"))
          print(f"passed={'true' if report['passed'] else 'false'}")
          PY
      - name: Run full multi-window lifecycle Shadow L3
        if: steps.quick.outputs.passed == 'true'
        run: python tools/evaluate_directional_shadow_lifecycle_mpv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-shadow-lifecycle-mpv-l3
          path: |
            runtime/shadow_lifecycle_mpv_quick_report.json
            runtime/shadow_lifecycle_mpv_production_report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Post lifecycle Shadow result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 lifecycle Shadow MPV L3 `{os.environ['GITHUB_RUN_ID']}`")
          quick_path = Path("runtime/shadow_lifecycle_mpv_quick_report.json")
          if not quick_path.exists():
              print("\nNo quick report was produced; inspect targeted tests/evaluator before economic interpretation.")
          else:
              quick = json.loads(quick_path.read_text(encoding="utf-8"))
              print(f"\n- baseline reproduction: **{quick['baseline_reproduction']}**")
              if 'base' in quick and 'stress' in quick:
                  print(f"- QUICK Base full_recent: **{quick['base']['annualized_return']:.6%}**, DD {quick['base']['max_drawdown']:.6%}")
                  print(f"- QUICK Stress full_recent: **{quick['stress']['annualized_return']:.6%}**, DD {quick['stress']['max_drawdown']:.6%}")
                  print(f"- QUICK Stress gross peak: **{quick['stress']['max_realized_gross_notional_ratio']:.6f}x**")
                  print(f"- QUICK Stress halted: **{quick['stress']['halted']}**")
              print(f"- QUICK promotion gate: **{quick['passed']}**")
              if quick.get('reasons'):
                  print("- QUICK failed gates: " + ", ".join(quick['reasons']))

          full_path = Path("runtime/shadow_lifecycle_mpv_production_report.json")
          if full_path.exists():
              report = json.loads(full_path.read_text(encoding="utf-8"))
              shadow = report['shadow']
              candidate = report['candidate']
              base = candidate['base']['windows']
              stress = candidate['stress']['windows']
              print(f"- lifecycle completed runs: **{shadow['completed_signal_runs']}**, active median **{shadow['lifecycle_median']:.4f} sessions**")
              print(f"- Production Base full_recent: **{base['full_recent']['annualized_return']:.6%}**, DD {base['full_recent']['max_drawdown']:.6%}")
              print(f"- Production Stress full_recent: **{stress['full_recent']['annualized_return']:.6%}**, DD {stress['full_recent']['max_drawdown']:.6%}")
              print(f"- Production Stress validation: **{stress['validation']['annualized_return']:.6%}**, DD {stress['validation']['max_drawdown']:.6%}")
              print(f"- Production Stress OOS: **{stress['oos']['annualized_return']:.6%}**, DD {stress['oos']['max_drawdown']:.6%}")
              econ = report['economics']['stress']
              print(f"- Stress turnover: **{econ['turnover_notional']:.2f}**")
              print(f"- Stress net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
              gate = report['promotion_gate']
              print(f"- FINAL promotion gate: **{gate['passed']}**")
              if gate['reasons']:
                  print("- FINAL failed gates: " + ", ".join(gate['reasons']))
          PY
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
