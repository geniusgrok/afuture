name: directional-microstructure-dev

# temporary draft-PR targeted verification harness; removed before final PR
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directional-microstructure-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/afuture-microstructure-cost-alpha-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Affected directional tests
        run: >-
          python -m pytest -q
          tests/test_sim_event_causality.py
          tests/test_directional_execution.py
          tests/test_directional_execution_efficiency.py
          tests/test_execution_aligned_policy.py
          tests/test_directional_attribution.py
          tests/test_directional_manager.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_risk_governor.py
          tests/test_directional_microstructure.py
          tests/test_directional_timing.py
          tests/test_execution_cost_meta.py
          tests/test_directional_lineage.py
      - run: python -m compileall -q afuture
