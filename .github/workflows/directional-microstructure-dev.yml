name: directional-microstructure-dev

# temporary branch-only targeted verification harness; removed before final PR
on:
  push:
    branches:
      - codex/afuture-microstructure-cost-alpha-20260824
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: directional-microstructure-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[dev-result]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/afuture-microstructure-cost-alpha-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run affected directional and simulator tests
        id: tests
        shell: bash
        run: |
          set +e
          files=(
            tests/test_sim_event_causality.py
            tests/test_directional_execution.py
            tests/test_directional_execution_efficiency.py
            tests/test_execution_aligned_policy.py
            tests/test_directional_attribution.py
            tests/test_directional_manager.py
            tests/test_execution_aligned_runtime.py
            tests/test_directional_risk_governor.py
          )
          for optional in \
            tests/test_directional_microstructure.py \
            tests/test_directional_timing.py \
            tests/test_execution_cost_meta.py \
            tests/test_directional_lineage.py; do
            if [[ -f "$optional" ]]; then files+=("$optional"); fi
          done
          python -m pytest -q "${files[@]}" 2>&1 | tee /tmp/targeted.log
          code=${PIPESTATUS[0]}
          python -m compileall -q afuture
          compile_code=$?
          if [[ "$compile_code" -ne 0 && "$code" -eq 0 ]]; then code=$compile_code; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reuse fixed Production L3 input artifact
        if: contains(github.event.head_commit.message, '[research]') && steps.tests.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip > /tmp/fixed-l3-input.zip
          unzip -o /tmp/fixed-l3-input.zip -d runtime >/dev/null
          test -s runtime/broad_daily_universe.csv
          test -s runtime/return_target_specific_contracts.csv
      - name: Optional bounded research
        id: research
        if: contains(github.event.head_commit.message, '[research]') && steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python -m pip install akshare
          python tools/research_directional_p0_fixed.py 2>&1 | tee /tmp/research.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist verification evidence on the feature branch
        shell: bash
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          RESEARCH_EXIT: ${{ steps.research.outputs.exit_code }}
        run: |
          mkdir -p .dev
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "test_exit=${TEST_EXIT:-not-run}"
            echo "research_exit=${RESEARCH_EXIT:-not-run}"
            echo "--- targeted tail ---"
            tail -n 80 /tmp/targeted.log || true
            if [[ -f /tmp/research.log ]]; then
              echo "--- research tail ---"
              tail -n 80 /tmp/research.log
            fi
          } > .dev/last-verification.txt
          if [[ -f runtime/microstructure_report.json ]]; then
            cp runtime/microstructure_report.json .dev/microstructure_report.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .dev
          git commit -m "chore: record directional dev verification [dev-result]" || true
          git push origin HEAD:codex/afuture-microstructure-cost-alpha-20260824
      - name: Enforce targeted result
        shell: bash
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          RESEARCH_EXIT: ${{ steps.research.outputs.exit_code }}
        run: |
          test "${TEST_EXIT}" = "0"
          if [[ -n "${RESEARCH_EXIT}" ]]; then test "${RESEARCH_EXIT}" = "0"; fi
