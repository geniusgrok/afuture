name: directional-microstructure-dev

on:
  push:
    branches:
      - codex/afuture-microstructure-cost-alpha-20260824
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directional-microstructure-dev-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/afuture-microstructure-cost-alpha-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Affected directional and simulator tests
        shell: bash
        run: |
          files=(
            tests/test_sim_event_causality.py
            tests/test_directional_execution.py
            tests/test_directional_execution_efficiency.py
            tests/test_execution_aligned_policy.py
            tests/test_directional_attribution.py
            tests/test_directional_manager.py
            tests/test_execution_aligned_runtime.py
            tests/test_directional_risk_governor.py
          )
          for optional in \
            tests/test_directional_microstructure.py \
            tests/test_directional_timing.py \
            tests/test_execution_cost_meta.py; do
            if [[ -f "$optional" ]]; then files+=("$optional"); fi
          done
          python -m pytest -q "${files[@]}"
      - run: python -m compileall -q afuture

  research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[research]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare
      - name: Bounded microstructure research
        run: python tools/research_directional_microstructure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-microstructure-research
          path: runtime/microstructure_*
          retention-days: 7
