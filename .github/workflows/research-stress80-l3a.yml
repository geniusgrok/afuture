name: research-stress80-l3a

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-l3a.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-l3a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l3a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download frozen historical inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/stress80-fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/stress80-fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/stress80-fixed-input.zip \
            broad_daily_universe.csv \
            return_target_specific_contracts.csv \
            -d runtime
      - name: Verify focused causal research surface
        run: >-
          python -m pytest -q
          tests/test_directional_opportunity_ledger.py
          tests/test_directional_causal_edge.py
          tests/test_directional_net_edge_allocator.py
          tests/test_directional_stress80_research.py
          tests/test_directional_stress80_evaluator.py
      - name: Run fixed-input L3A
        run: python tools/evaluate_directional_stress80.py
      - name: Verify report lineage and fixed research boundary
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/stress80_l3a_report.json", encoding="utf-8"))
          assert report["production_wiring"] is False
          assert report["fixed_horizons"] == [5, 10, 20]
          assert report["parameter_search"] is False
          assert report["opportunity_ledger"]["off_policy_labels"] is True
          assert report["opportunity_ledger"]["strict_visibility_rule"] == "label_available_date < decision_date"
          for window in ("validation", "oos", "full_recent"):
              assert report["risk"][window]["max_target_gross"] <= 2.0 + 1e-10
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-l3a-evidence
          path: |
            runtime/stress80_l3a_report.json
            runtime/stress80_l3a_weights.csv
            runtime/stress80_l3a_expected_product_returns.csv
          retention-days: 14
      - name: Post L3A result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/stress80-comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 L3A workflow `{os.environ['GITHUB_RUN_ID']}`")
          report_path = Path("runtime/stress80_l3a_report.json")
          if not report_path.exists():
              print("\nL3A did not produce a report; inspect the workflow failure before any economic interpretation.")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              stress = report["stress"]
              econ = report["economics"]["stress"]["full_recent"]
              gate = report["l3a_gate"]
              print(f"\n- gate: **{gate['passed']}**")
              print(f"- Stress full_recent annualized: **{stress['full_recent']['annualized_return']:.6%}**")
              print(f"- Stress validation annualized: **{stress['validation']['annualized_return']:.6%}**")
              print(f"- Stress OOS annualized: **{stress['oos']['annualized_return']:.6%}**")
              print(f"- Stress full_recent DD: **{stress['full_recent']['max_drawdown']:.6%}**")
              print(f"- Stress net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
              print(f"- ledger rows: **{report['opportunity_ledger']['rows']}**")
              if gate["reasons"]:
                  print("- failed gates: " + ", ".join(gate["reasons"]))
          PY
          gh pr comment 21 --body-file /tmp/stress80-comment.md
