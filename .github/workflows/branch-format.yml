name: branch-format

on:
  push:
    branches:
      - codex/production-operations
    paths:
      - .github/workflows/branch-format.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.4
      - run: |
          python -m ruff check --fix tests/test_production_operations_edge_cases.py
          python -m ruff format tests/test_production_operations_edge_cases.py
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_production_operations_edge_cases.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply canonical import ordering"
            git push origin HEAD:codex/production-operations
          fi
