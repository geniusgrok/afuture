name: research-stress80-receipt-flow

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-receipt-flow.yml"
      - "afuture/directional_receipt_flow.py"
      - "tools/fetch_directional_receipt_flow.py"
      - "tools/evaluate_directional_receipt_flow.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-receipt-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        window: [prior1, prior2, train, validation, oos]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download frozen directional input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip broad_daily_universe.csv return_target_specific_contracts.csv -d runtime
      - name: Fetch fixed CZCE receipt-flow window
        run: >-
          python tools/fetch_directional_receipt_flow.py
          --window ${{ matrix.window }}
          --output-dir runtime/receipt_flow
      - uses: actions/upload-artifact@v4
        with:
          name: stress80-receipt-flow-${{ matrix.window }}
          path: runtime/receipt_flow/
          retention-days: 14

  evaluate:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download frozen specific-contract input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime/receipt_flow
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime
      - uses: actions/download-artifact@v4
        with:
          pattern: stress80-receipt-flow-*
          path: runtime/receipt_flow
          merge-multiple: true
      - name: Verify receipt-flow unit tests
        run: python -m pytest -q tests/test_directional_receipt_flow.py
      - name: Run independent receipt-flow alpha screen
        run: python tools/evaluate_directional_receipt_flow.py
      - uses: actions/upload-artifact@v4
        with:
          name: stress80-receipt-flow-evidence
          path: |
            runtime/receipt_flow/
            runtime/receipt_flow_screen.json
          retention-days: 14
      - name: Post receipt-flow result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/receipt-comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 CZCE receipt-flow screen `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/receipt_flow_screen.json")
          if not path.exists():
              print("\nNo economic report was produced; inspect collection/evaluation failures first.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"\n- gate: **{report['gate']['passed']}**")
              for window in ("prior1", "prior2", "train", "validation", "oos", "full_recent"):
                  metrics = report["stress"][window]
                  print(f"- Stress {window}: **{metrics['annualized_return']:.6%}**, DD {metrics['max_drawdown']:.6%}")
              econ = report["economics"]["stress"]["full_recent"]
              print(f"- full_recent net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
              for window, audit in report["source_audits"].items():
                  print(f"- coverage {window}: **{audit['coverage']:.2%}**")
              if report["gate"]["reasons"]:
                  print("- failed gates: " + ", ".join(report["gate"]["reasons"]))
          PY
          gh pr comment 21 --body-file /tmp/receipt-comment.md
