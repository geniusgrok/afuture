name: verify-stress68-checkpoint

on:
  push:
    branches:
      - promote/stress68-oi-freeze
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.91
      - name: Focused checkpoint tests
        run: >-
          python -m pytest -q
          tests/test_directional_60m_oi_confirmation.py
          tests/test_directional_freeze_new_risk.py
      - name: Affected Production mechanics smoke
        run: python tools/test_directional_production_mechanics.py
      - name: Download frozen Production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime
      - name: Download frozen 60m evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516473115/zip" \
            -o /tmp/prior.zip
          echo "d0adcfb348c5ae89ddb488474c088d74a2402a2426c0e84fee7877dda5bd2a4e  /tmp/prior.zip" | sha256sum -c -
          unzip -j /tmp/prior.zip prior_two_year_broad_60m.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516472727/zip" \
            -o /tmp/recent.zip
          echo "68ff2200eed8326741ce76f1cff46379c4e1dbc263297f4602bd84422e95e421  /tmp/recent.zip" | sha256sum -c -
          unzip -j /tmp/recent.zip two_year_broad_60m.csv -d runtime
      - name: Reproduce fixed 68.06 Production L3
        run: python tools/evaluate_directional_60m_oi_freeze.py
      - name: Verify checkpoint metrics and hard gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('runtime/stress80_60m_oi_freeze_production_report.json').read_text())
          b = r['candidate']['base']['windows']['full_recent']
          s = r['candidate']['stress']['windows']['full_recent']
          sw = r['candidate']['stress']['windows']
          e = r['economics']['stress']
          assert abs(b['annualized_return'] - 1.21132378) <= 5e-5, b
          assert abs(s['annualized_return'] - 0.68059063) <= 5e-5, s
          assert s['max_drawdown'] >= -0.30 - 1e-12, s
          assert b['max_drawdown'] >= -0.30 - 1e-12, b
          assert s['max_realized_gross_notional_ratio'] <= 2.0 + 1e-10, s
          assert b['max_realized_gross_notional_ratio'] <= 2.0 + 1e-10, b
          assert not s['halted'] and not b['halted']
          assert int(s['margin_reject_days']) == 0 and int(b['margin_reject_days']) == 0
          assert sw['validation']['annualized_return'] > 0.0
          assert sw['oos']['annualized_return'] > 0.0
          assert e['net_alpha_per_turnover_bps'] >= 28.52
          print(json.dumps({
              'base_annualized': b['annualized_return'],
              'stress_annualized': s['annualized_return'],
              'stress_dd': s['max_drawdown'],
              'stress_validation': sw['validation']['annualized_return'],
              'stress_oos': sw['oos']['annualized_return'],
              'stress_net_alpha_per_turnover_bps': e['net_alpha_per_turnover_bps'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress68-checkpoint-evidence
          path: runtime/stress80_60m_oi_freeze_production_report.json
          retention-days: 14
      - name: Post checkpoint verification to PR 22
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path
          print(f"### Clean Stress68 checkpoint verification `{os.environ['GITHUB_RUN_ID']}`")
          path = Path('runtime/stress80_60m_oi_freeze_production_report.json')
          if not path.exists():
              print('\nNo report was produced; inspect the workflow failure.')
          else:
              r = json.loads(path.read_text())
              b = r['candidate']['base']['windows']['full_recent']
              s = r['candidate']['stress']['windows']['full_recent']
              sw = r['candidate']['stress']['windows']
              e = r['economics']['stress']
              print(f"\n- Base annualized: **{b['annualized_return']:.6%}**, DD {b['max_drawdown']:.6%}")
              print(f"- Stress annualized: **{s['annualized_return']:.6%}**, DD {s['max_drawdown']:.6%}")
              print(f"- Stress validation: **{sw['validation']['annualized_return']:.6%}**")
              print(f"- Stress OOS: **{sw['oos']['annualized_return']:.6%}**")
              print(f"- Stress gross peak: **{s['max_realized_gross_notional_ratio']:.6f}x**")
              print(f"- Stress margin rejects: **{s['margin_reject_days']}**, halted={s['halted']}")
              print(f"- Stress net alpha / turnover: **{e['net_alpha_per_turnover_bps']:.6f} bps**")
              print('- This is a checkpoint, not the final >=80% promotion.')
          PY
          gh pr comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
