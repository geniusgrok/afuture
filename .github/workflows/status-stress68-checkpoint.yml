name: status-stress68-checkpoint

on:
  push:
    branches:
      - promote/stress68-oi-freeze
    paths:
      - ".github/workflows/status-stress68-checkpoint.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Post branch workflow status to PR 22
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --limit 20 \
            --json databaseId,name,status,conclusion,headSha,createdAt \
            > /tmp/runs.json
          python - <<'PY' > /tmp/status.md
          import json
          import os
          rows = json.load(open('/tmp/runs.json', encoding='utf-8'))
          print(f"### Stress68 checkpoint workflow status `{os.environ['GITHUB_RUN_ID']}`")
          print()
          for row in rows:
              conclusion = row.get('conclusion') or '-'
              sha = str(row.get('headSha') or '')[:8]
              print(f"- `{row['databaseId']}` **{row['name']}**: {row['status']} / {conclusion} @ `{sha}`")
          PY
          gh pr comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
