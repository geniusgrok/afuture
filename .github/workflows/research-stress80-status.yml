name: research-stress80-status

# Lightweight status-only checkpoint. This workflow never runs a strategy or test suite.
# Refresh point: stale-margin GREEN + four-year 60m coverage.
on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-status.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: List current research branch workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --limit 30 \
            --json databaseId,name,status,conclusion,headSha,createdAt \
            > /tmp/runs.json
          python - <<'PY' > /tmp/status.md
          import json
          import os
          rows = json.load(open('/tmp/runs.json', encoding='utf-8'))
          print(f"### Stress80 workflow status `{os.environ['GITHUB_RUN_ID']}`")
          print()
          for row in rows:
              conclusion = row.get('conclusion') or '-'
              sha = str(row.get('headSha') or '')[:8]
              print(f"- `{row['databaseId']}` **{row['name']}**: {row['status']} / {conclusion} @ `{sha}`")
          PY
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
