name: research-pit-data-probe

# Temporary source-coverage probe. Remove after evidence is recorded.
on:
  pull_request:
    paths:
      - .github/workflows/research-pit-data-probe.yml
      - tools/probe_directional_pit_sources.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-pit-data-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "akshare==1.18.84" pandas

      - name: Download exact frozen Production input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/production-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/production-input.zip" | sha256sum -c -
          unzip -q /tmp/production-input.zip -d runtime

      - name: Probe historical PIT source coverage
        run: python tools/probe_directional_pit_sources.py > runtime/directional_pit_source_probe.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-pit-source-probe
          path: |
            runtime/directional_pit_source_probe.json
            runtime/directional_pit_source_probe.log
          retention-days: 14
