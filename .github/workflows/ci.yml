name: ci

# Fast engineering gates run on the minimum supported Python.  Expensive research
# evidence remains in the manual workflows below; this workflow protects every PR.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy afuture

  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q afuture
      - run: python -m afuture --help
      - run: afuture validate --config config/afuture.example.toml
      - name: Core boundary, manifest, diagnostics, and compatibility smoke
        run: >-
          python -m pytest -q
          tests/test_cli_portability.py::test_core_cli_help_and_validation_do_not_import_posix_locking
          tests/test_config.py::test_load_config_rejects_lossy_integer_values
          tests/test_config.py::test_stationarity_compatibility_defaults_and_explicit_pair_value
          tests/test_directional_stress90_final.py::test_fixed_input_loader_rejects_bad_input_before_any_csv_parser
          tests/test_directional_stress90_final.py::test_fixed_input_loader_verifies_every_file_before_parsing_verified_bytes
          tests/test_execution_aligned_policy.py::test_intraday_proxy_rejects_each_invalid_active_market_cell
          tests/test_execution_aligned_policy.py::test_intraday_proxy_ignores_each_invalid_zero_exposure_market_cell
          tests/test_execution_aligned_policy.py::test_intraday_proxy_accepts_return_at_exact_absolute_limit
          tests/test_portfolio_time_alignment.py::test_insufficient_common_timestamp_buckets_reject_additional_risk
          tests/test_directional_attribution.py::test_production_attribution_adds_flat_pathwise_robustness_diagnostics
          tests/test_directional_stress90_final.py::test_final_matrix_assembly_rejects_manifest_with_wrong_frozen_digest
          tests/test_workflow_contracts.py

  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt

      - name: Full repository tests
        run: python -m pytest -q
      - run: python -m compileall -q afuture

      - run: afuture validate --config config/afuture.example.toml
      - name: Validate calendar live example
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
        run: afuture validate --config config/afuture.live.example.toml
      - name: Validate directional live example
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
        run: afuture validate --config config/afuture.directional-live.example.toml
      - name: Validate Stress-90 commissioning example
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
          AFUTURE_CTP_ACCOUNT_ID: test-account
          AFUTURE_CTP_CURRENCY_ID: CNY
        run: afuture validate --config config/afuture.directional-stress90-live.example.toml

      - name: Directional production smoke
        run: >-
          python -m pytest -q
          tests/test_directional_activity.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_manager.py
          tests/test_directional_engine.py
          tests/test_directional_quality.py
          tests/test_directional_restart.py
          tests/test_directional_surface.py
          tests/test_directional_acceptance.py
          tests/test_directional_acceptance_simulation.py
          tests/test_directional_review_regressions.py
          tests/test_directional_trading_day_selection.py

      - run: afuture replay --config config/afuture.example.toml --data examples/sample_ticks.csv
      - name: Verify fixed-pair replay closure
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/replay_report.json", encoding="utf-8"))
          assert report["performance"]["trade_count"] == 4
          assert report["positions"] == []
          assert report["account"]["margin"] == 0
          PY

      - run: afuture validate --config config/afuture.auto-replay.example.toml
      - run: afuture replay --config config/afuture.auto-replay.example.toml --data examples/auto_sample_ticks.csv
      - name: Verify Auto replay closure
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/auto_replay_report.json", encoding="utf-8"))
          assert report["performance"]["trade_count"] == 4
          assert report["positions"] == []
          assert report["account"]["margin"] == 0
          PY

      - run: afuture scan --config config/afuture.example.toml --data examples/research_ticks.csv
      - run: >-
          afuture accept
          --config config/afuture.example.toml
          --data examples/research_ticks.csv
          --pair m_calendar
          --train-days 4
          --validation-days 2
          --oos-days 2
          --step-days 2
          --stress-multipliers 1.0,1.5,2.0

      - name: Verify Auto research data quality
        run: >-
          afuture data-check
          --config config/afuture.auto-replay.example.toml
          --data examples/research_ticks.csv
          --output runtime/data_quality.json

      - name: Run final Auto Portfolio walk-forward/OOS/stress entrypoint
        shell: bash
        run: |
          set +e
          afuture accept-auto \
            --config config/afuture.auto-replay.example.toml \
            --data examples/research_ticks.csv \
            --train-days 4 \
            --validation-days 2 \
            --oos-days 2 \
            --step-days 2 \
            --stress-multipliers 1.0,1.5,2.0 \
            --output runtime/auto_acceptance.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          python - <<'PY'
          import json
          report = json.load(open("runtime/auto_acceptance.json", encoding="utf-8"))
          assert report["folds"]
          assert set(report["stress_results"]) == {"1.0", "1.5", "2.0"}
          for key in (
              "leave_one_product_out",
              "single_product",
              "remove_best_period",
              "depth_haircut",
              "latency",
              "market_impact",
              "data_gap",
              "quote_skew",
              "activity_missing",
          ):
              assert key in report["robustness"]
          assert "aggregate_oos_return" in report["gate_metrics"]
          PY

      - name: Verify execution quality report entrypoint
        run: |
          afuture quality-report \
            --config config/afuture.auto-replay.example.toml \
            --output runtime/execution_quality_report.json
          python - <<'PY'
          import json
          report = json.load(open("runtime/execution_quality_report.json", encoding="utf-8"))
          assert "round_trips" in report
          assert "p95_slippage" in report
          assert "directional" in report
          for key in (
              "rebalance_events",
              "fill_count",
              "cycles",
              "turnover_notional",
              "commission_total",
              "median_slippage_bps",
              "p95_slippage_bps",
              "median_tracking_error",
          ):
              assert key in report["directional"]
          PY

      - name: Shadow zero-write smoke
        run: python -m pytest -q tests/test_cli_safety.py -k shadow
      - name: Stress-90 production mechanics
        run: >-
          python -m pytest -q
          tests/test_stress90_live_risk_capacity.py
          tests/test_stress90_live_risk_capacity_regression.py
          tests/test_directional_stress90_planner.py
          tests/test_directional_stress90_fail_closed.py
      - run: python tools/test_directional_production_mechanics.py
      - run: python -m afuture --help
