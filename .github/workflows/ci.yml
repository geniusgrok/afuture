name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job names are retained for repository rules; each job uses its named platform/version.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Current Python syntax
        run: python -m compileall -q afuture

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e . -c constraints/core-dev.txt
      - name: Windows core CLI smoke (no native CTP)
        run: |
          python -m afuture --help
          afuture validate --config config/afuture.example.toml

  installed-core:
    name: test (3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . -c constraints/core-dev.txt
      - run: python -m pip check
      - name: Installed core imports on Python 3.13
        run: |
          python -I - <<'PY'
          import importlib
          import pkgutil
          import afuture
          imported = [afuture.__name__]
          for module in pkgutil.walk_packages(afuture.__path__, afuture.__name__ + "."):
              if module.name != "afuture.__main__":
                  importlib.import_module(module.name)
                  imported.append(module.name)
          print(f"Imported {len(imported)} installed modules")
          PY

  test:
    name: test (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Current functionality and execution safety tests
        run: python -m pytest -q
