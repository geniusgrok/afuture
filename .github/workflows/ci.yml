name: ci

# Final repository gate after the production-return feature cleanup.
on:
  push:
  pull_request:

jobs:
  test:
    # Intermediate Stress80 research uses impact-scoped workflows. Restore this file
    # byte-for-byte from main before the final candidate so the full matrix runs once.
    if: github.head_ref != 'research/stress80-post-checkpoint' && github.ref_name != 'research/stress80-post-checkpoint'
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Full repository tests
        run: python -m pytest -q
      - run: python -m compileall -q afuture

      - run: afuture validate --config config/afuture.example.toml
      - name: Validate calendar live example
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
        run: afuture validate --config config/afuture.live.example.toml
      - name: Validate directional live example
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
        run: afuture validate --config config/afuture.directional-live.example.toml

      - name: Directional production smoke
        run: >-
          python -m pytest -q
          tests/test_directional_activity.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_manager.py
          tests/test_directional_engine.py
          tests/test_directional_quality.py
          tests/test_directional_restart.py
          tests/test_directional_surface.py
          tests/test_directional_acceptance.py
          tests/test_directional_acceptance_simulation.py
          tests/test_directional_review_regressions.py
          tests/test_directional_trading_day_selection.py

      - run: afuture replay --config config/afuture.example.toml --data examples/sample_ticks.csv
      - name: Verify fixed-pair replay closure
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/replay_report.json", encoding="utf-8"))
          assert report["performance"]["trade_count"] == 4
          assert report["positions"] == []
          assert report["account"]["margin"] == 0
          PY

      - run: afuture validate --config config/afuture.auto-replay.example.toml
      - run: afuture replay --config config/afuture.auto-replay.example.toml --data examples/auto_sample_ticks.csv
      - name: Verify Auto replay closure
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/auto_replay_report.json", encoding="utf-8"))
          assert report["performance"]["trade_count"] == 4
          assert report["positions"] == []
          assert report["account"]["margin"] == 0
          PY

      - run: afuture scan --config config/afuture.example.toml --data examples/research_ticks.csv
      - run: >-
          afuture accept
          --config config/afuture.example.toml
          --data examples/research_ticks.csv
          --strategy grid
          --short-windows 2,3
          --long-windows 5,7
          --entry-zs 0.8,1.0
          --exit-zs 0.2,0.3
          --stops 1.8,2.2
          --min-trades 1
          --max-drawdown 0.50
          --min-sharpe -100
          --max-train-oos-gap 100
          --min-oos-pairs 1
          --top-pairs 1
          --output runtime/acceptance_report.json
      - name: Verify acceptance report
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/acceptance_report.json", encoding="utf-8"))
          assert "selected" in report
          assert "parameters" in report["selected"]
          assert "train" in report["selected"]
          assert "oos" in report["selected"]
          PY

      - run: afuture scan --config config/afuture.auto-replay.example.toml --data examples/auto_research_ticks.csv
      - name: Auto data quality
        run: >-
          afuture data-quality
          --config config/afuture.auto-replay.example.toml
          --data examples/auto_research_ticks.csv
          --output runtime/auto_data_quality.json
      - name: Verify Auto data quality
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/auto_data_quality.json", encoding="utf-8"))
          assert report["accepted"] is True
          PY

      - name: Final Auto Portfolio walk-forward/OOS/stress
        run: >-
          python tools/evaluate_auto_portfolio.py
          --config config/afuture.auto-replay.example.toml
          --data examples/auto_research_ticks.csv
          --output runtime/auto_portfolio_report.json
      - name: Execution quality report
        run: >-
          python tools/evaluate_execution_quality.py
          --config config/afuture.auto-replay.example.toml
          --data examples/auto_research_ticks.csv
          --output runtime/execution_quality_report.json
      - run: python tools/test_directional_production_mechanics.py
      - run: python -m afuture --help
