name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q afuture
      - run: python -m afuture --help
      - run: afuture validate --config config/afuture.example.toml
      - name: Current functionality and execution safety tests
        run: python -m pytest -q
