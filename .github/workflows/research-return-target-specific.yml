name: research-return-target-specific

# Research-only historical evidence: manual evaluation, not a forecast or promotional claim.
# Expensive 50-product concrete-contract L4 milestone gate. Re-run manually only after a
# material change to the frozen policy, execution timing, contract selection, costs or
# production-mechanics methodology. One fetch feeds every L4 evaluator below.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-return-target-specific-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specific-return-target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install akshare pandas numpy
          -c constraints/core-dev.txt -c constraints/live.txt
      - name: Verify execution timing and roll-safe causality
        run: |
          python tools/test_return_target_specific.py
          python tools/test_directional_production_mechanics.py
      - name: Rebuild baseline L3 directional evidence
        run: |
          python tools/fetch_broad_daily_universe.py
          python tools/evaluate_aggressive_directional.py
      - name: Fetch all concrete contracts needed for every L4 evaluator
        run: python tools/fetch_return_target_specific_daily.py
      - name: Validate original execution-aware concrete-contract baseline
        run: |
          python tools/evaluate_return_target_specific.py
          python - <<'PY'
          import json
          report = json.load(open("runtime/return_target_specific_report.json", encoding="utf-8"))
          assert report["specific_contracts"] is True
          assert report["roll_safe"] is True
          assert report["pristine_final_oos"] is False
          assert report["max_gross_leverage"] <= 2.0
          assert report["selection_frozen"] is True
          assert report["execution_selection"]["pool_size"] == 32
          assert report["execution_selection"]["effective_gross_leverage"] <= 2.0
          PY
      - name: Validate frozen 96-template execution-aligned L4
        run: |
          python tools/evaluate_execution_aligned_target.py
          python - <<'PY'
          import json
          report = json.load(open("runtime/execution_aligned_target_report.json", encoding="utf-8"))
          assert report["specific_contracts"] is True
          assert report["roll_safe"] is True
          assert report["selection_frozen"] is True
          assert report["pristine_final_oos"] is False
          assert report["max_gross_leverage"] <= 2.0
          assert report["execution_selection"]["pool_size"] == 96
          assert report["target"]["target_met"] is True
          PY
      - name: Validate integer/account production-mechanics proxy on the same data
        run: |
          python tools/evaluate_directional_production_mechanics.py
          python - <<'PY'
          import json
          report = json.load(open("runtime/directional_production_mechanics_report.json", encoding="utf-8"))
          assert report["selection_frozen"] is True
          assert report["parameter_search"] is False
          assert report["margin_is_historical_truth"] is False
          assert report["mechanics"]["integer_lots"] is True
          assert report["mechanics"]["previous_completed_activity"] is True
          assert report["mechanics"]["reduction_before_open"] is True
          assert report["base"]["margin_rate_proxy"] == 0.12
          assert report["stress"]["margin_rate_proxy"] == 0.15
          assert set(report["production_gap"]) == {"base", "stress"}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-target-specific-evidence
          path: |
            runtime/broad_daily_universe.csv
            runtime/aggressive_directional_report.json
            runtime/aggressive_directional_weights.csv
            runtime/return_target_specific_contracts.csv
            runtime/return_target_specific_summary.csv
            runtime/return_target_specific_failures.txt
            runtime/return_target_specific_selection.csv
            runtime/return_target_execution_weights.csv
            runtime/return_target_specific_report.json
            runtime/execution_aligned_target_report.json
            runtime/execution_aligned_weights.csv
            runtime/execution_aligned_specific_selection.csv
            runtime/directional_production_mechanics_report.json
            runtime/directional_production_base_daily.csv
            runtime/directional_production_stress_daily.csv
          retention-days: 14
