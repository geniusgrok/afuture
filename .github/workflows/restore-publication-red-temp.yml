name: restore-publication-red-temp

on:
  push:
    branches:
      - codex/deployment-provenance-recovery

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]' -c constraints/core-dev.txt
      - run: python -m pytest -q tests/test_restore_publication_safety.py
