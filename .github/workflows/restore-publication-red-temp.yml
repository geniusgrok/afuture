name: restore-publication-red-temp

on:
  push:
    branches:
      - codex/deployment-provenance-recovery

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]' -c constraints/core-dev.txt
      - run: python tools/apply_provenance_safety_fix_temp.py
      - run: python -m ruff format afuture/provenance.py afuture/runtime_backup_impl.py
      - run: python -m ruff check afuture/provenance.py afuture/runtime_backup_impl.py tests/test_restore_publication_safety.py tests/test_provenance_native_identity.py
      - run: >-
          python -m pytest -q
          tests/test_restore_publication_safety.py
          tests/test_provenance_native_identity.py
      - name: Commit targeted GREEN
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add afuture/provenance.py afuture/runtime_backup_impl.py
          git commit -m 'fix: harden deployment native identity and restore publication'
          git push origin HEAD:codex/deployment-provenance-recovery
