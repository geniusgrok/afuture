name: unattended-doc-consistency
on:
  push:
    branches: [codex/unattended-24x7-20260922]
    paths: [.github/workflows/unattended-doc-consistency.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply three hash-bound documentation corrections
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          branch="codex/unattended-24x7-20260922"
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          assert os.environ["GITHUB_REPOSITORY"]=="ychenracing/afuture"
          assert os.environ["GITHUB_REF"]=="refs/heads/"+branch
          assert git("rev-parse","HEAD^")=="569e8678107aab3cdc722a95f32c5b21280098d7"
          assert not git("status","--porcelain")
          records={'README.md': {'before_sha256': 'a146405f75b61f1574a6a5c691b8bef69ae6d02cfa9cbdb882595a0849d3ba96', 'after_sha256': '06d0fbafef197a690a1d33aca47ff0b615967e569c2825d36577d19766a2a795', 'prefix': 'Live 使用 `runtime/process_run.json` 的 current/.prev receipt 建立异常重启围栏。', 'replacement': 'Live 启动先取得账户/runtime 互斥锁，再核验 `runtime/process_run.json` 的进程证据。身份与完整性已确认的未清洁退出，会在构造 order-capable Broker 前失效技术许可、将现有账户状态设为 HALTED/kill switch，并以退出码 75 阻止重启循环。证据损坏、身份不符或现有账户状态缺失时保留原件并只读阻断，不新建空账户、不收编 `.prev`、不改写未知账户；重复启动也不得改变当前活动实例的状态。`deploy/systemd/` 提供通用 live/watchdog 模板，机器私有参数必须放在 EnvironmentFile；自动重启不提供跨日或实盘授权。', 'after_blob': 'bb0a9840a925dd6a582578908566450cda1901a1'}, 'docs/live-trading.md': {'before_sha256': '47a5ccdc1132c0bad886fe7e2595845713155092bb0695c55b19c3fb0ef8fcfa', 'after_sha256': '8da221c7e1d05cb8e34bd8f9dda587dd06329bff97454702a85758d7c7f8dff8', 'prefix': 'Live 启动在构造 order-capable Broker 前检查 `process_run.json`。', 'replacement': 'Live 启动先取得账户/runtime 锁，在构造 order-capable Broker 前检查 `process_run.json`。已核验身份和完整性的未清洁退出会失效技术许可，并把现有账户状态设为 HALTED/kill switch。损坏或异账户证据、缺失的已有账户状态保持只读阻断，不创建资金基线或自动采用 `.prev`；重复启动不得干扰活动实例。既有事故恢复仍须完成安全核验和所需授权；systemd 自动重启本身不构成 activation authority。', 'after_blob': '6218bcdb5ac3cba97d2b52947c85693b902b85ce'}, 'docs/stress90-live-runbook.md': {'before_sha256': '3f6b47ab8be7e88abfefad6f1ae2e293c33a3b5c2bd8f2bda6ec6bf47a925620', 'after_sha256': 'e1bbaeaf47fa6596da616ec4cd9e04f336adbf40c91ae70f41c3ae237c130803', 'prefix': 'systemd live 模板使用 `Restart=on-failure`，但异常/不确定重启围栏使用退出码 75', 'replacement': 'systemd live 模板使用 `Restart=on-failure`，异常/不确定重启使用退出码 75 并列入 `RestartPreventExitStatus`。启动先持有账户/runtime 互斥锁，再检查进程证据。已核验身份和完整性的未清洁退出失效技术许可，并把现有账户状态设为 HALTED/kill switch；损坏、身份不符或已有账户状态丢失时保留证据并只读阻断。不得自动采用 `.prev` 或重建空账户。watchdog timer 只读证据并告警，不控制账户、不平仓、不解除 HALTED。', 'after_blob': '93f515bd77ddb31d40aeaf16ad3d613e0349c7b5'}}
          for name,r in records.items():
              p=Path(name);data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==r["before_sha256"]
              lines=data.decode().splitlines()
              rows=[i for i,s in enumerate(lines) if s.startswith(r["prefix"])]
              assert len(rows)==1
              lines[rows[0]]=r["replacement"]
              output=("\n".join(lines)+"\n").encode()
              assert hashlib.sha256(output).hexdigest()==r["after_sha256"]
              p.write_bytes(output)
          git("add",*records)
          assert set(git("diff","--cached","--name-only").splitlines())==set(records)
          assert git("ls-remote","origin","refs/heads/"+branch).split()[0]==os.environ["GITHUB_SHA"]
          git("config","user.name","github-actions[bot]")
          git("config","user.email","41898282+github-actions[bot]@users.noreply.github.com")
          git("commit","-m","docs: align restart instructions with verified account ownership")
          git("push","origin","HEAD:refs/heads/"+branch)
          after=git("rev-parse","HEAD")
          assert git("ls-remote","origin","refs/heads/"+branch).split()[0]==after
          out=Path(os.environ["RUNNER_TEMP"])/"afuture-doc-source"
          out.mkdir()
          (out/"SOURCE_SHA").write_text(after+"\n")
          (out/"git-tree.txt").write_text(git("ls-tree","-r","--full-tree","HEAD")+"\n")
          (out/"doc-corrections.json").write_text(json.dumps(records,ensure_ascii=False)+"\n")
          git("archive","--format=tar.gz","--output="+str(out/"source.tar.gz"),"HEAD")
          (out/"SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n" for p in sorted(out.iterdir())))
          print(json.dumps({"source_sha":after,"documentation_files_verified":len(records)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: afuture-doc-source-${{ github.sha }}
          path: ${{ runner.temp }}/afuture-doc-source/
          retention-days: 7
          if-no-files-found: error
