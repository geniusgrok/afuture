name: research-stress80-targeted

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - "afuture/directional_opportunity_ledger.py"
      - "afuture/directional_causal_edge.py"
      - "afuture/directional_net_edge_allocator.py"
      - "afuture/directional_stress80_research.py"
      - "afuture/directional_member_flow.py"
      - "afuture/directional_receipt_flow.py"
      - "afuture/directional_cost_aware_no_trade.py"
      - "afuture/directional_stress_balanced_meta.py"
      - "afuture/directional_prior_product_selection.py"
      - "afuture/directional_historical_margin.py"
      - "afuture/directional_60m_oi_confirmation.py"
      - "afuture/directional_shadow_mpv.py"
      - "afuture/directional_shadow_mpv_robustness.py"
      - "afuture/directional_integer_tracking.py"
      - "afuture/directional_freeze_new_risk.py"
      - "afuture/directional_acceptance.py"
      - "afuture/directional_robustness.py"
      - "tests/test_directional_opportunity_ledger.py"
      - "tests/test_directional_causal_edge.py"
      - "tests/test_directional_net_edge_allocator.py"
      - "tests/test_directional_stress80_research.py"
      - "tests/test_directional_stress80_evaluator.py"
      - "tests/test_directional_member_flow.py"
      - "tests/test_directional_receipt_flow.py"
      - "tests/test_directional_cost_aware_no_trade.py"
      - "tests/test_directional_stress_balanced_meta.py"
      - "tests/test_directional_prior_product_selection.py"
      - "tests/test_directional_historical_margin.py"
      - "tests/test_directional_60m_oi_confirmation.py"
      - "tests/test_directional_60m_oi_production_gate.py"
      - "tests/test_directional_shadow_mpv.py"
      - "tests/test_directional_shadow_mpv_robustness.py"
      - "tests/test_directional_integer_tracking.py"
      - "tests/test_directional_freeze_new_risk.py"
      - "tools/evaluate_directional_stress80.py"
      - "tools/evaluate_directional_member_flow.py"
      - "tools/evaluate_directional_receipt_flow.py"
      - "tools/evaluate_directional_cost_aware_no_trade.py"
      - "tools/evaluate_directional_stress_balanced_meta.py"
      - "tools/evaluate_directional_prior_product_selection.py"
      - "tools/evaluate_directional_60m_oi_confirmation.py"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run existing focused Stress 80 tests
        shell: bash
        run: |
          existing=()
          for file in \
            tests/test_directional_opportunity_ledger.py \
            tests/test_directional_causal_edge.py \
            tests/test_directional_net_edge_allocator.py \
            tests/test_directional_stress80_research.py \
            tests/test_directional_stress80_evaluator.py \
            tests/test_directional_member_flow.py \
            tests/test_directional_receipt_flow.py \
            tests/test_directional_cost_aware_no_trade.py \
            tests/test_directional_stress_balanced_meta.py \
            tests/test_directional_prior_product_selection.py \
            tests/test_directional_historical_margin.py \
            tests/test_directional_60m_oi_confirmation.py \
            tests/test_directional_60m_oi_production_gate.py \
            tests/test_directional_shadow_mpv.py \
            tests/test_directional_shadow_mpv_robustness.py \
            tests/test_directional_integer_tracking.py \
            tests/test_directional_freeze_new_risk.py
          do
            if [ -f "$file" ]; then
              existing+=("$file")
            fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "No focused Stress 80 tests exist yet."
            exit 0
          fi
          python -m pytest -q "${existing[@]}"
      - run: python -m compileall -q afuture
