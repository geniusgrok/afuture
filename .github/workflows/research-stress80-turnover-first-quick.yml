name: research-stress80-turnover-first-quick

on:
  push:
    branches:
      - research/stress80-post-checkpoint
    paths:
      - ".github/workflows/research-stress80-turnover-first-quick.yml"
      - "afuture/directional_turnover_first_survivor_reallocation.py"
      - "tests/test_directional_turnover_first_survivor_reallocation.py"
      - "tools/evaluate_directional_turnover_first_survivor_quick.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-turnover-first-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.91
      - name: Focused turnover-first tests
        run: >-
          python -m pytest -q
          tests/test_directional_cost_aware_no_trade.py
          tests/test_directional_60m_oi_confirmation.py
          tests/test_directional_freeze_new_risk.py
          tests/test_directional_turnover_first_survivor_reallocation.py
      - name: Affected Production mechanics smoke
        run: python tools/test_directional_production_mechanics.py
      - name: Download frozen Production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv broad_daily_universe.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime
      - name: Download frozen 60m evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516473115/zip" -o /tmp/prior.zip
          echo "d0adcfb348c5ae89ddb488474c088d74a2402a2426c0e84fee7877dda5bd2a4e  /tmp/prior.zip" | sha256sum -c -
          unzip -j /tmp/prior.zip prior_two_year_broad_60m.csv -d runtime
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516472727/zip" -o /tmp/recent.zip
          echo "68ff2200eed8326741ce76f1cff46379c4e1dbc263297f4602bd84422e95e421  /tmp/recent.zip" | sha256sum -c -
          unzip -j /tmp/recent.zip two_year_broad_60m.csv -d runtime
      - name: Run five-window quick Production gate
        run: python tools/evaluate_directional_turnover_first_survivor_quick.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-turnover-first-quick
          path: runtime/stress80_turnover_first_quick_report.json
          retention-days: 14
      - name: Post quick result to PR 23
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.md
          import json, os
          from pathlib import Path
          print(f"### Stress80 turnover-first quick Production gate `{os.environ['GITHUB_RUN_ID']}`")
          path = Path('runtime/stress80_turnover_first_quick_report.json')
          if not path.exists():
              print('\nNo report was produced; inspect workflow failure before economic interpretation.')
          else:
              r = json.loads(path.read_text(encoding='utf-8'))
              b = r['base_full_recent']
              s = r['stress']
              print(f"\n- Base full_recent: **{b['annualized_return']:.6%}**, DD {b['max_drawdown']:.6%}, gross {b['max_realized_gross_notional_ratio']:.6f}x, halted={b['halted']}")
              for window in ('train','validation','oos','full_recent'):
                  x = s[window]
                  print(f"- Stress {window}: **{x['annualized_return']:.6%}**, DD {x['max_drawdown']:.6%}, gross {x['max_realized_gross_notional_ratio']:.6f}x, halted={x['halted']}, margin_rejects={x['margin_reject_days']}")
              e = r['economics']
              print(f"- Stress turnover: **{e['turnover_notional']:.2f}**")
              print(f"- Stress transaction cost: **{e['transaction_cost']:.2f}**")
              print(f"- Stress net alpha / turnover: **{e['net_alpha_per_turnover_bps']:.6f} bps**")
              print(f"- delta vs 71.703271% survivor: **{r['delta_vs_71_survivor_stress_annualized']:.6%}**")
              print(f"- quick promotion gate: **{r['promotion_gate']['passed']}**")
              if r['promotion_gate']['reasons']:
                  print('- failed gates: ' + ', '.join(r['promotion_gate']['reasons']))
          PY
          gh pr comment 23 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
