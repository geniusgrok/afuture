name: research-stress80-drawdown-reserve-tdd

on:
  push:
    branches:
      - research/stress80-post-checkpoint
    paths:
      - ".github/workflows/research-stress80-drawdown-reserve-tdd.yml"
      - "tests/test_directional_drawdown_reserve_freeze.py"
      - "afuture/directional_drawdown_reserve_freeze.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-stress80-drawdown-reserve-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Focused drawdown-reserve freeze tests
        run: python -m pytest -q tests/test_directional_drawdown_reserve_freeze.py
