name: operator-continuity-format-fix

on:
  push:
    branches:
      - codex/operator-managed-continuity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install 'ruff>=0.12,<1'
      - name: Apply exact formatter and remove this temporary workflow
        run: |
          python -m ruff format afuture/account_runtime_registry.py afuture/directional.py
          rm .github/workflows/operator-continuity-format-fix.yml
          python -m ruff format --check .
          git diff --check
      - name: Commit formatting-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format operator continuity changes"
          git push origin HEAD:codex/operator-managed-continuity
