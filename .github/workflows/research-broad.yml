name: research-broad

# L3 economic-pair breadth evidence is a milestone gate, not an inner-loop test.
# The rejected cross-sectional families are summarized in docs/research-final-evidence.md
# rather than retained as dead research code. Rerun manually only when the surviving
# economic-pair methodology changes materially.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-broad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broad-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install akshare pandas
          -c constraints/core-dev.txt -c constraints/live.txt
      - name: Verify economic-pair research causality and fail-closed leverage
        run: python tools/test_broad_pair_regime.py
      - name: Verify strongest-pair rotation and overlap control
        run: python tools/test_broad_pair_rotation.py
      - name: Fetch broad continuous daily factor universe
        run: python tools/fetch_broad_daily_universe.py
      - name: Screen economic pairs with persistence and volatility regime
        run: python tools/evaluate_broad_pair_regime.py
      - name: Screen capital-efficient strongest-pair rotation
        run: python tools/evaluate_broad_pair_rotation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-economic-pair-evidence
          path: |
            runtime/broad_daily_universe.csv
            runtime/broad_daily_universe_summary.csv
            runtime/broad_daily_universe_failures.txt
            runtime/broad_pair_regime_report.json
            runtime/broad_pair_rotation_report.json
          retention-days: 14
