name: research-stress80-hourly-timing-l3

on:
  push:
    branches:
      - research/stress-80-causal-product-alpha
    paths:
      - ".github/workflows/research-stress80-hourly-timing-l3.yml"
      - "afuture/directional_hourly_timing.py"
      - "tests/test_directional_hourly_timing.py"
      - "tools/evaluate_directional_hourly_timing.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: research-stress80-hourly-timing-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare==1.18.84
      - name: Download frozen Production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p runtime
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/fixed-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/fixed-input.zip" | sha256sum -c -
          unzip -j /tmp/fixed-input.zip return_target_specific_contracts.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/baseline.zip" | sha256sum -c -
          unzip -j /tmp/baseline.zip execution_aligned_weights.csv -d runtime

      - name: Download frozen 60m coverage artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516473115/zip" \
            -o /tmp/hourly-prior.zip
          echo "d0adcfb348c5ae89ddb488474c088d74a2402a2426c0e84fee7877dda5bd2a4e  /tmp/hourly-prior.zip" | sha256sum -c -
          unzip -j /tmp/hourly-prior.zip prior_two_year_broad_60m.csv -d runtime

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9516472727/zip" \
            -o /tmp/hourly-recent.zip
          echo "68ff2200eed8326741ce76f1cff46379c4e1dbc263297f4602bd84422e95e421  /tmp/hourly-recent.zip" | sha256sum -c -
          unzip -j /tmp/hourly-recent.zip two_year_broad_60m.csv -d runtime

      - name: Verify hourly timing causality and risk semantics
        run: python -m pytest -q tests/test_directional_hourly_timing.py
      - name: Run fixed 60m timing Production L3
        run: python tools/evaluate_directional_hourly_timing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress80-hourly-timing-l3
          path: runtime/hourly_timing_production_report.json
          retention-days: 14
      - name: Post hourly timing result to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/hourly-comment.md
          import json
          import os
          from pathlib import Path

          print(f"### Stress80 60m timing Production L3 `{os.environ['GITHUB_RUN_ID']}`")
          path = Path("runtime/hourly_timing_production_report.json")
          if not path.exists():
              print("\nNo report was produced; inspect targeted test/evaluator failure before economic interpretation.")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"\n- usable products: `{report['usable_products']}`")
              print(f"- changed weight cells: **{report['changed_weight_cells']}**")
              print(f"- signal weight turnover: **{report['baseline_weight_turnover']:.4f}x -> {report['candidate_weight_turnover']:.4f}x**")
              cheap = report['cheap_screen']
              print(f"- cheap Base full_recent: **{cheap['base']['full_recent']['annualized_return']:.6%}**")
              print(f"- cheap Stress full_recent: **{cheap['stress']['full_recent']['annualized_return']:.6%}**")
              prod = report['production_l3']
              base = prod['base']['windows']
              stress = prod['stress']['windows']
              print(f"- Production Base full_recent: **{base['full_recent']['annualized_return']:.6%}**, DD {base['full_recent']['max_drawdown']:.6%}")
              print(f"- Production Stress full_recent: **{stress['full_recent']['annualized_return']:.6%}**, DD {stress['full_recent']['max_drawdown']:.6%}")
              print(f"- Production Stress validation: **{stress['validation']['annualized_return']:.6%}**, DD {stress['validation']['max_drawdown']:.6%}")
              print(f"- Production Stress OOS: **{stress['oos']['annualized_return']:.6%}**, DD {stress['oos']['max_drawdown']:.6%}")
              econ = report['economics']['stress']
              print(f"- Stress turnover: **{econ['turnover_notional']:.2f}**")
              print(f"- Stress net alpha / turnover: **{econ['net_alpha_per_turnover_bps']:.6f} bps**")
              gate = report['promotion_gate']
              print(f"- Stress80 promotion gate: **{gate['passed']}**")
              if gate['reasons']:
                  print("- failed gates: " + ", ".join(gate['reasons']))
          PY
          gh pr comment 21 --body-file /tmp/hourly-comment.md
