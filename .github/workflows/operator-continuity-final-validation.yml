name: operator-continuity-final-validation

on:
  push:
    branches:
      - codex/operator-managed-continuity

permissions:
  contents: read

jobs:
  acceptance-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Validate every example configuration
        env:
          AFUTURE_CTP_USER: test-user
          AFUTURE_CTP_PASSWORD: test-password
          AFUTURE_CTP_BROKER: test-broker
          AFUTURE_CTP_ACCOUNT_ID: test-account
          AFUTURE_CTP_CURRENCY_ID: CNY
        run: |
          for config in config/*.example.toml; do
            afuture validate --config "$config"
          done
      - name: Fixed-pair replay closure
        run: |
          afuture replay --config config/afuture.example.toml --data examples/sample_ticks.csv
          python - <<'PY'
          import json
          report = json.load(open("runtime/replay_report.json", encoding="utf-8"))
          assert report["performance"]["trade_count"] == 4
          assert report["positions"] == []
          assert report["account"]["margin"] == 0
          PY
      - name: Auto replay closure
        run: |
          afuture replay --config config/afuture.auto-replay.example.toml --data examples/auto_sample_ticks.csv
          python - <<'PY'
          import json
          report = json.load(open("runtime/auto_replay_report.json", encoding="utf-8"))
          assert report["performance"]["trade_count"] == 4
          assert report["positions"] == []
          assert report["account"]["margin"] == 0
          PY
      - name: Shadow zero-write smoke
        run: >-
          python -m pytest -q
          tests/test_cli_safety.py
          tests/test_directional_stress90_activation.py
          -k "shadow or doctor_preflight_never_calls_send_order"
      - name: Stress-90 production mechanics smoke
        run: |
          python tools/test_directional_production_mechanics.py
          python -m pytest -q \
            tests/test_stress90_operator_continuity.py \
            tests/test_stress90_operator_roll_forward.py \
            tests/test_stress90_operator_roll_forward_plan.py \
            tests/test_stress90_operator_permit.py \
            tests/test_stress90_operator_status.py \
            tests/test_stress90_operator_rebase_reanchor.py \
            tests/test_stress90_operator_receipt_authority.py \
            tests/test_stress90_operator_zero_write.py
      - name: CLI help surface
        run: python -m afuture --help
