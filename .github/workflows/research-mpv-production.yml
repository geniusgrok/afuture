name: research-mpv-production

# Temporary fixed-input P0 research gate. Remove before final merge.
on:
  push:
    branches:
      - research/production-mpv-integer-optimizer
    paths:
      - .github/workflows/research-mpv-production.yml
      - afuture/directional_mpv.py
      - afuture/directional_mpv_attribution.py
      - afuture/directional_integer_optimizer.py
      - afuture/directional_mpv_research.py
      - afuture/directional_mpv_robustness.py
      - tools/evaluate_directional_mpv_production.py
      - tests/test_directional_mpv*.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-mpv-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-production-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Targeted MPV tests
        run: >-
          python -m pytest -q
          tests/test_directional_mpv.py
          tests/test_directional_integer_optimizer.py
          tests/test_directional_mpv_attribution.py
          tests/test_directional_mpv_research.py
          tests/test_directional_mpv_robustness.py
          tests/test_directional_mpv_production_evaluator.py

      - name: Download exact frozen Production inputs and weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" \
            -o /tmp/production-input.zip
          echo "ab4321a9cf8b9a61a0f9d435a6fb6bba7dd63986043b429c12c0ff47fd15389c  /tmp/production-input.zip" | sha256sum -c -
          unzip -q /tmp/production-input.zip -d runtime

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9491959916/zip" \
            -o /tmp/production-baseline.zip
          echo "e531f2874cbc26c3a54ff561e074f59b86ac887a1f509e33effd6908eaa3144d  /tmp/production-baseline.zip" | sha256sum -c -
          unzip -qo /tmp/production-baseline.zip -d runtime

      - name: Run fixed-input MPV Production L3
        run: python tools/evaluate_directional_mpv_production.py > runtime/mpv_production.log

      - name: Build baseline comparison summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          runtime = Path("runtime")
          baseline = json.load(open(runtime / "directional_production_mechanics_report.json", encoding="utf-8"))
          candidate = json.load(open(runtime / "mpv_production_report.json", encoding="utf-8"))

          summary = {"windows": {}, "full_recent": {}, "hard_risk": {}}
          for side in ("base", "stress"):
              summary["windows"][side] = {}
              for window in ("prior1", "prior2", "train", "validation", "oos", "full_recent"):
                  base = baseline[side]["windows"][window]
                  cand = candidate[side]["windows"][window]
                  summary["windows"][side][window] = {
                      "baseline_annualized_return": base["annualized_return"],
                      "candidate_annualized_return": cand["annualized_return"],
                      "annualized_return_delta": cand["annualized_return"] - base["annualized_return"],
                      "baseline_sharpe": base["sharpe"],
                      "candidate_sharpe": cand["sharpe"],
                      "baseline_max_drawdown": base["max_drawdown"],
                      "candidate_max_drawdown": cand["max_drawdown"],
                      "candidate_active_days": cand["active_days"],
                  }
              summary["full_recent"][side] = candidate["economics"][side]
              full = candidate[side]["windows"]["full_recent"]
              summary["hard_risk"][side] = {
                  "max_realized_gross_notional_ratio": full["max_realized_gross_notional_ratio"],
                  "margin_reject_days": full["margin_reject_days"],
                  "halted": full["halted"],
              }
              assert full["max_realized_gross_notional_ratio"] <= 2.0 + 1e-9

          (runtime / "mpv_production_comparison.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpv-production-l3-evidence
          path: |
            runtime/mpv_production_report.json
            runtime/mpv_production_comparison.json
            runtime/mpv_production.log
            runtime/mpv_production_base_daily.csv
            runtime/mpv_production_stress_daily.csv
            runtime/mpv_production_base_events.csv
            runtime/mpv_production_stress_events.csv
            runtime/directional_production_mechanics_report.json
            runtime/execution_aligned_weights.csv
          retention-days: 14
