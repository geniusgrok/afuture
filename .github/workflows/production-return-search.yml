name: production-return-search

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/production-return-search.yml

concurrency:
  group: production-return-search-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  pareto-search:
    if: github.head_ref == 'codex/afuture-production-return-100-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Download frozen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/specific /tmp/final
          gh api /repos/${{ github.repository }}/actions/artifacts/9473260618/zip > /tmp/specific.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/9474502870/zip > /tmp/final.zip
          unzip -q /tmp/specific.zip -d /tmp/specific
          unzip -q /tmp/final.zip -d /tmp/final
      - name: Search daily circuit and per-contract sizing
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from afuture.directional_acceptance import DirectionalProductionAcceptance, ProductionMechanicsConfig
          from afuture.directional_risk import DirectionalRiskGovernor
          from tools.evaluate_directional_production_mechanics import _result_stats

          specific = pd.read_csv('/tmp/specific/return_target_specific_contracts.csv')
          long_weights = pd.read_csv('/tmp/final/execution_aligned_weights.csv')
          weights = long_weights.pivot(index='level_0', columns='level_1', values='weight').fillna(0.0)
          weights.index = pd.to_datetime(weights.index)
          weights = weights.sort_index().loc['2024-08-21':'2026-08-20']

          prepared = DirectionalProductionAcceptance(ProductionMechanicsConfig()).prepare_contracts(specific)
          no_scale = DirectionalRiskGovernor(
              volatility_trigger=99.0,
              loss_trigger=99.0,
              defensive_scale=1.0,
          )
          results = []
          for daily_loss in (0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08):
              for cap in (25, 30, 35, 40):
                  config = ProductionMechanicsConfig(
                      max_contract_volume=cap,
                      max_daily_loss_ratio=daily_loss,
                      max_total_drawdown_ratio=0.30,
                      max_margin_ratio=0.35,
                      min_available_ratio=0.25,
                  )
                  sim = DirectionalProductionAcceptance(config)
                  sim.risk_governor = no_scale
                  result = sim.simulate(specific, weights, cost_bps=5.0, prepared=prepared)
                  stats = _result_stats(result)
                  row = {
                      'daily_loss': daily_loss,
                      'cap': cap,
                      'annualized_return': stats['annualized_return'],
                      'total_return': stats['total_return'],
                      'max_drawdown': stats['max_drawdown'],
                      'sharpe': stats['sharpe'],
                      'halted': stats['halted'],
                      'daily_circuit_days': stats['daily_circuit_days'],
                      'margin_reject_days': stats['margin_reject_days'],
                      'max_realized_gross_notional_ratio': stats['max_realized_gross_notional_ratio'],
                  }
                  results.append(row)
                  print('CANDIDATE', json.dumps(row, sort_keys=True))
          eligible = [
              r for r in results
              if not r['halted']
              and r['max_drawdown'] >= -0.30
              and r['max_realized_gross_notional_ratio'] <= 2.15
          ]
          eligible.sort(key=lambda r: (r['annualized_return'], r['sharpe']), reverse=True)
          print('TOP_ELIGIBLE', json.dumps(eligible[:16], sort_keys=True))
          above = [r for r in eligible if r['annualized_return'] >= 1.0]
          print('ABOVE_TARGET', json.dumps(above, sort_keys=True))
          assert eligible, 'no non-halted candidate survived hard gates'
          PY
