name: live-risk-capacity-fix3

on:
  push:
    branches:
      - codex/live-risk-capacity
    paths:
      - .github/live-risk-capacity-fix3.py
      - .github/workflows/live-risk-capacity-fix3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/live-risk-capacity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints/core-dev.txt
      - name: Apply verified code fixes without workflow mutation
        run: python .github/live-risk-capacity-fix3.py
      - name: Commit verified checkpoint and remove all runners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/live-risk-capacity-fix.py .github/workflows/live-risk-capacity-fix.yml
          rm -f .github/live-risk-capacity-fix2.py .github/workflows/live-risk-capacity-fix2.yml
          rm -f .github/live-risk-capacity-fix3.py .github/workflows/live-risk-capacity-fix3.yml
          git add -A
          git commit -m "Fix Stress-90 risk capacity verification"
          git push origin HEAD:codex/live-risk-capacity
