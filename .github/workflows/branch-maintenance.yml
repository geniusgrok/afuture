name: branch-maintenance

on:
  push:
    branches:
      - codex/production-operations
    paths:
      - .github/workflows/branch-maintenance.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply deterministic branch-local patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch marker missing: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, block: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              target.write_text(text.rstrip() + "\n\n" + block.strip() + "\n", encoding="utf-8")

          process = Path("afuture/process_run.py")
          text = process.read_text(encoding="utf-8")
          marker = "    def mark_phase(\n"
          method = '''    def record_restart_fence(\n        self,\n        *,\n        deployment_digest: str,\n        runtime_identity_digest: str,\n        account_identity_digest: str,\n        state_checksum: str,\n    ) -> ProcessRunRecord:\n        current = self.load_required()\n        if current.clean_shutdown:\n            raise ProcessRunIntegrityError(\n                "restart fence requires an unclean current process-run"\n            )\n        now = _utc_now()\n        state = _hex64(state_checksum, name="restart fence state checksum")\n        candidate = ProcessRunRecord(\n            process_uuid=_uuid(str(uuid4())),\n            phase="restart_fenced",\n            deployment_digest=_hex64(deployment_digest, name="deployment digest"),\n            runtime_identity_digest=_hex64(\n                runtime_identity_digest, name="runtime identity digest"\n            ),\n            account_identity_digest=_hex64(\n                account_identity_digest, name="account identity digest"\n            ),\n            start_state_checksum=state,\n            latest_state_checksum=state,\n            stop_state_checksum=state,\n            started_utc=now,\n            stopped_utc=now,\n            clean_shutdown=True,\n            sequence=current.sequence + 1,\n            parent_checksum=current.checksum,\n            checksum="",\n        )\n        candidate = replace(candidate, checksum=_checksum(_unsigned(candidate)))\n        return self._replace(candidate, current)\n\n'''
          if "def record_restart_fence(" not in text:
              if marker not in text:
                  raise SystemExit("process-run insertion marker missing")
              process.write_text(text.replace(marker, method + marker, 1), encoding="utf-8")

          replace_once(
              "afuture/process_run.py",
              '''    handler = process_store.begin(\n        deployment_digest=deployment_digest,\n        runtime_identity_digest=runtime_identity_digest,\n        account_identity_digest=account_identity_digest,\n        start_state_checksum=fenced_state.checksum,\n        _allow_unclean_parent=True,\n    )\n    finished = process_store.finish_clean(\n        handler.process_uuid,\n        stop_state_checksum=fenced_state.checksum,\n        phase="restart_fenced",\n    )\n''',
              '''    finished = process_store.record_restart_fence(\n        deployment_digest=deployment_digest,\n        runtime_identity_digest=runtime_identity_digest,\n        account_identity_digest=account_identity_digest,\n        state_checksum=fenced_state.checksum,\n    )\n''',
          )

          replace_once(
              "afuture/runtime_heartbeat.py",
              '''    def _age(source: object, attribute: str) -> float:\n        raw = getattr(source, attribute, 0.0)\n        if isinstance(raw, bool) or not isinstance(raw, (int, float)) or float(raw) <= 0:\n            return 0.0\n        return max(0.0, monotonic() - float(raw))\n''',
              '''    def _age(source: object, attribute: str) -> float | None:\n        raw = getattr(source, attribute, None)\n        if isinstance(raw, bool) or not isinstance(raw, (int, float)) or float(raw) <= 0:\n            return None\n        return max(0.0, monotonic() - float(raw))\n''',
          )

          replace_once(
              "afuture/command_router.py",
              '''    except ProcessRunIntegrityError as exc:\n        reason = f"unclean restart fence: process-run integrity failure ({type(exc).__name__})"\n        _halt_unknown_process_run(config, reason=reason)\n        _canonical_print(\n            {\n                "passed": False,\n                "command": "live",\n                "restart_fence": True,\n                "error": reason,\n                "orders_sent": 0,\n                "cancels_sent": 0,\n            }\n        )\n        return PROCESS_FENCE_EXIT_CODE\n''',
              '''    except Exception as exc:\n        reason = f"unclean restart fence: local fence failure ({type(exc).__name__})"\n        try:\n            _halt_unknown_process_run(config, reason=reason)\n        except Exception:\n            pass\n        _canonical_print(\n            {\n                "passed": False,\n                "command": "live",\n                "restart_fence": True,\n                "error": reason,\n                "orders_sent": 0,\n                "cancels_sent": 0,\n            }\n        )\n        return PROCESS_FENCE_EXIT_CODE\n''',
          )
          replace_once(
              "afuture/command_router.py",
              "        ProcessRunIntegrityError,\n",
              "",
          )

          Path("deploy/systemd/afuture-live.service").write_text('''[Unit]\nDescription=afuture live trading process\nAfter=network-online.target\nWants=network-online.target\nStartLimitIntervalSec=300\nStartLimitBurst=3\n\n[Service]\nType=simple\nWorkingDirectory=/opt/afuture\nEnvironmentFile=-/etc/afuture/afuture.env\nUMask=0077\nExecStart=/opt/afuture/.venv/bin/afuture live --config /etc/afuture/afuture.toml $AFUTURE_LIVE_FLAGS\nKillSignal=SIGTERM\nTimeoutStopSec=45\nRestart=on-failure\nRestartSec=5\nRestartPreventExitStatus=75\nNoNewPrivileges=true\nLimitNOFILE=65536\n\n[Install]\nWantedBy=multi-user.target\n''', encoding="utf-8")
          Path("deploy/systemd/afuture-watchdog.service").write_text('''[Unit]\nDescription=afuture local heartbeat watchdog\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nWorkingDirectory=/opt/afuture\nUMask=0077\nExecStart=/opt/afuture/.venv/bin/afuture watchdog --config /etc/afuture/afuture.toml --once --max-age-seconds 15\nNoNewPrivileges=true\n''', encoding="utf-8")

          for cfg in (
              "config/afuture.live.example.toml",
              "config/afuture.directional-live.example.toml",
              "config/afuture.directional-stress90-live.example.toml",
          ):
              path = Path(cfg)
              text = path.read_text(encoding="utf-8")
              if "heartbeat_interval_seconds" not in text:
                  text = text.replace(
                      "metadata_timeout_seconds = 15\n",
                      "metadata_timeout_seconds = 15\nheartbeat_interval_seconds = 5\n",
                      1,
                  )
              if "heartbeat =" not in text:
                  text = text.replace(
                      'alert = "runtime/',
                      'heartbeat = "runtime/heartbeat.json"\nalert = "runtime/',
                      1,
                  )
              path.write_text(text, encoding="utf-8")

          append_once("README.md", "## 生产盘前与进程托管", '''
          ## 生产盘前与进程托管

          Stress-90 的当前生产操作顺序只有一条：`deployment-verify` → `prepare-session` → 必要时人工 `stress90-operator-roll-forward` 或 `stress90-account-rebase` → `doctor` → `stress90-capacity-report` 人工复核 → 人工签发新的 activation permit → `live` → `watchdog` → 仅在 `HALTED` 且 kill switch 开启时执行 backup/recovery。

          `prepare-session` 是一次性、只读柜台准备命令。它验证 deployment seal、本地状态和 artifact，取得权威 CTP trading day、fresh account、完整持仓、活动委托、catalog、metadata/quote/margin/commission，并复用 Doctor P0、continuity/rebase 与 capacity 逻辑输出 canonical JSON；其 Broker 能力层禁止报单和撤单，永不签发 permit、永不自动 roll-forward/rebase、永不把 runtime 切到 `RUNNING`。可选 `--refresh-ohlc` 仍在 engine 外复用现有 OHLC refresh，不把外部 provider 接入订单路径。

          Shadow/Live 的正常主循环按 `execution.heartbeat_interval_seconds`（默认 5 秒，允许 1–60 秒）原子更新 `paths.heartbeat`。外部 `afuture watchdog --once` 只读 heartbeat、deployment 和本地 checksummed state，不连接 CTP、不持有 order-capable lease，也不会 kill/restart、平仓、解除 HALTED 或修改 permit/state。

          Live 使用 `runtime/process_run.json` 的 current/.prev receipt 建立异常重启围栏。任何没有 clean shutdown receipt、current 损坏或 current 缺失但 `.prev` 存在的窗口都在构造 order-capable Broker 前 fail closed：失效已签发 permit、保持/转换 `HALTED`、开启 kill switch，并以专用退出码 75 阻止 systemd 重启循环。`deploy/systemd/` 提供只含通用机器路径的 live/watchdog 模板；operator 必须在机器私有 EnvironmentFile 中提供本机运行参数，模板不内置 live confirmation、activation、roll-forward 或 rebase。
          ''')

          append_once("docs/configuration.md", "## 生产心跳配置", '''
          ## 生产心跳配置

          生产运维扩展由 canonical CLI router 从同一 TOML 读取；`afuture validate` 同样接受这些字段：

          | 字段 | 默认值 | 约束与含义 |
          | --- | ---: | --- |
          | `paths.heartbeat` | 与 `paths.state` 同目录的 `heartbeat.json` | Shadow 自动使用其独立 runtime 目录中的同名文件。必须指向本机普通文件；symlink 和非普通文件拒绝写入。 |
          | `execution.heartbeat_interval_seconds` | `5` | 主循环心跳间隔，秒；必须为有限数且位于 `1..60`。Tick、order、trade 和 account callback 不直接写 heartbeat。 |

          heartbeat 只包含不可逆账户身份摘要、deployment/risk/state identity、freshness/queue/连接状态和 process receipt 信息，不写原始 AccountID、用户名、密码、AuthCode 或 webhook。写失败会告警，但不能阻止已经决定的撤单、减仓或其他风控动作。
          ''')

          append_once("docs/live-trading.md", "## 当前生产启动顺序", '''
          ## 当前生产启动顺序

          生产 Stress-90 只使用以下顺序：

          ```text
          deployment-verify
          → prepare-session
          → [仅在报告要求时] operator roll-forward / account rebase
          → doctor
          → capacity review
          → issue fresh activation permit
          → live
          → watchdog
          → HALTED backup/recovery
          ```

          `prepare-session` 和 `watchdog` 都不能报单、撤单、修改交易 state、签发 permit 或自动解除 HALTED。`prepare-session` 可以连接只读 CTP/Doctor Broker 取得 fresh facts；`watchdog` 完全不需要 CTP 凭证且不会连接 Broker。

          Live 启动在构造 order-capable Broker 前检查 `process_run.json`。上一进程没有 clean receipt、receipt 损坏或链不确定时，启动必须 fail closed 到 `HALTED` + kill switch，并失效旧 permit；operator 重新完成盘前检查、Doctor 和新的 permit 后才允许再次尝试。systemd 的自动 restart 不构成 activation authority。
          ''')

          append_once("docs/production-checklist.md", "## 盘前、托管与 Watchdog", '''
          ## 盘前、托管与 Watchdog

          - [ ] `deployment-verify` 与已安装 bundle/seed/policy/deployment identity 一致。
          - [ ] `prepare-session --confirm-live --output <path>` 返回 0，JSON 明确 `orders_sent=0`、`cancels_sent=0`，continuity/rebase、alignment、Doctor P0 与 capacity 结果已人工复核。
          - [ ] 如 preflight 要求 continuity roll-forward 或 account rebase，只执行报告列出的人工命令；完成后重新跑 `prepare-session` 和 `doctor`。
          - [ ] capacity warnings 已人工确认，随后才签发新的 activation permit；不得由 systemd 或 watchdog 自动签发。
          - [ ] `paths.heartbeat` 位于本机受保护目录，`heartbeat_interval_seconds` 为 1–60 秒，watchdog timer 能以无 CTP 凭证身份运行。
          - [ ] `deploy/systemd/afuture-live.service` 未启用 `PrivateTmp=true`，机器私有 EnvironmentFile 不进入仓库；退出码 75 位于 `RestartPreventExitStatus`。
          - [ ] `process_run.json` current/.prev 完整；若出现 unclean restart fence，保持 HALTED/kill switch，不通过重启循环绕过。
          - [ ] 备份只在 HALTED 且 kill switch=true 时执行；备份失败不应停止或控制交易进程。
          ''')

          append_once("docs/stress90-live-runbook.md", "## 生产盘前与常驻监督", '''
          ## 生产盘前与常驻监督

          当前唯一生产操作链：

          ```bash
          afuture deployment-verify --config <config>
          afuture prepare-session --config <config> --confirm-live --output <session-preflight.json> [--refresh-ohlc]
          # 仅按 preflight 的 allowed_next_actions 处理 operator continuity / account rebase
          afuture doctor --config <config> --confirm-live
          afuture stress90-capacity-report --config <config> --confirm-live
          # 人工复核后按既有机制签发新的 activation permit
          afuture live --config <config> --confirm-live
          afuture watchdog --config <config> --once --max-age-seconds 15
          ```

          `prepare-session` 一次运行后立即退出，不进入常驻循环；它不会签发 permit、恢复 RUNNING、清除 kill switch、修改 risk scale、自动 roll-forward/rebase，也不会从 live 订单路径同步调用外部 OHLC provider。安全阻断退出码为 2，配置/调用错误使用独立非零码。

          systemd live 模板使用 `Restart=on-failure`，但异常/不确定重启围栏使用退出码 75 并列入 `RestartPreventExitStatus`。该围栏在任何 order-capable Broker 构造前运行；旧 permit 被失效，generic state 保持/转为 HALTED 且 kill switch=true。watchdog timer 只读本地证据并告警，不 kill/restart live 进程、不平仓、不解除 HALTED。
          ''')

          append_once("docs/troubleshooting.md", "## Heartbeat、Watchdog 与异常重启", '''
          ## Heartbeat、Watchdog 与异常重启

          `afuture watchdog --config <config> --once --max-age-seconds <N>` 非零时先读取 canonical JSON 中的失败 check，不要用 restart、rebase、roll-forward 或 permit 作为通用修复。常见分类包括 heartbeat missing/corrupt/stale、broker unhealthy、account/position/quote stale、critical backlog、state/deployment/risk digest mismatch、HALTED 严重原因和 unclean restart fence。

          heartbeat 路径为 symlink、FIFO/device/目录或无法原子 fsync 时视为本机路径安全故障。修复权限/路径后重新执行 `prepare-session` 和 `doctor`；不要把 heartbeat 写入失败当成解除风控或跳过撤单/减仓的理由。

          若 `process_run.json` 表示上一进程没有 clean shutdown receipt，或 current 损坏/缺失而 `.prev` 存在，Live 会在 Broker 构造前以退出码 75 fail closed。此时确认 generic state 为 HALTED、kill switch=true、旧 permit 已失效；随后按 runbook 重新执行 `deployment-verify`、`prepare-session`、必要人工 continuity/rebase、`doctor`、capacity review 和新 permit。不要通过 systemd restart loop 绕过该流程。
          ''')

          append_once("docs/documentation-index.md", "## 生产运维入口", '''
          ## 生产运维入口

          当前生产顺序以 [`stress90-live-runbook.md`](stress90-live-runbook.md) 为操作权威：deployment verify → prepare-session → 必要人工 continuity/rebase → Doctor → capacity review → permit → Live → Watchdog → HALTED backup/recovery。字段定义见 [`configuration.md`](configuration.md)，实盘安全边界见 [`live-trading.md`](live-trading.md)，逐项验收见 [`production-checklist.md`](production-checklist.md)，故障处置见 [`troubleshooting.md`](troubleshooting.md)。systemd 部署模板位于仓库 `deploy/systemd/`，它们不包含账户凭证、live confirmation、activation 或 operator confirmation。
          ''')
          PY
      - name: Format changed Python
        run: |
          python -m pip install ruff==0.16.4
          python -m ruff format \
            afuture/command_router.py \
            afuture/heartbeat.py \
            afuture/process_run.py \
            afuture/session_preflight.py \
            afuture/watchdog.py \
            afuture/runtime_heartbeat.py \
            tests/test_heartbeat_watchdog.py \
            tests/test_process_run_fence.py \
            tests/test_session_preflight.py \
            tests/test_systemd_templates.py \
            tests/test_production_operations_edge_cases.py
      - name: Update systemd static expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_systemd_templates.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('assert "<AFUTURE_WORKDIR>" in combined\n    assert "<AFUTURE_ENV_FILE>" in combined', 'assert "/opt/afuture" in combined\n    assert "/etc/afuture/afuture.env" in combined')
          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff format tests/test_systemd_templates.py
      - name: Commit deterministic result
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afuture tests config deploy README.md docs
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize production operations safeguards"
            git push origin HEAD:codex/production-operations
          fi
