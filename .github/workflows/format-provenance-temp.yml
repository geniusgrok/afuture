name: format-provenance-temp

on:
  push:
    branches:
      - codex/deployment-provenance-recovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'ruff==0.16.4'
      - run: python -m ruff format afuture/runtime_backup_impl.py tests/test_runtime_backup.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add afuture/runtime_backup_impl.py tests/test_runtime_backup.py
          git commit -m 'style: apply ruff formatting'
          git push origin HEAD:codex/deployment-provenance-recovery
