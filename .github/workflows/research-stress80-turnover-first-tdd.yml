name: research-stress80-turnover-first-tdd

on:
  push:
    branches:
      - research/stress80-post-checkpoint
    paths:
      - ".github/workflows/research-stress80-turnover-first-tdd.yml"
      - "tests/test_directional_turnover_first_survivor_reallocation.py"
      - "afuture/directional_turnover_first_survivor_reallocation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-stress80-turnover-first-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Focused turnover-first survivor tests
        run: >-
          python -m pytest -q
          tests/test_directional_cost_aware_no_trade.py
          tests/test_directional_turnover_first_survivor_reallocation.py
