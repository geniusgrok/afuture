name: stress-80-efficiency-targeted

# Development gate for isolated execution-efficiency candidates. Expensive fixed L3
# runs only when the PR is explicitly marked ready for an economic promotion decision.
# The ready candidate below has frozen economics; docs and full CI follow final L3.
on:
  push:
    branches:
      - codex/afuture-stress-80-efficiency-20260823
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Targeted directional execution-efficiency tests
        run: >-
          python -m pytest -q
          tests/test_directional_execution_efficiency.py
          tests/test_execution_aligned_policy.py
          tests/test_directional_activity.py
          tests/test_directional_trading_day_selection.py
          tests/test_directional_stress_robustness.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_acceptance.py
          tests/test_directional_acceptance_simulation.py
          tests/test_directional_review_regressions.py
      - run: python -m compileall -q afuture

  fixed-production-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" akshare
      - name: Restore frozen directional inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9473260618/zip" > /tmp/fixed-directional-inputs.zip
          unzip -o /tmp/fixed-directional-inputs.zip -d runtime
          test -s runtime/return_target_specific_contracts.csv
          test -s runtime/broad_daily_universe.csv
      - name: Run fixed production mechanics
        run: python tools/evaluate_directional_production_mechanics.py > runtime/stress_80_l3.log
      - name: Print candidate evidence and verify unchanged hard gates
        run: |
          python - <<'PY'
          import json
          report = json.load(open("runtime/directional_production_mechanics_report.json", encoding="utf-8"))
          base = report["base"]["windows"]["full_recent"]
          stress = report["stress"]["windows"]["full_recent"]
          summary = {"base": base, "stress": stress, "mechanics": report["mechanics"], "turnover_attribution": report.get("turnover_attribution", {})}
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert report["base"]["cost_bps"] == 5.0
          assert report["stress"]["cost_bps"] == 15.0
          assert report["base"]["margin_rate_proxy"] == 0.12
          assert report["stress"]["margin_rate_proxy"] == 0.15
          for side in ("base", "stress"):
              item = report[side]
              assert item["margin_estimate_buffer"] == 1.25
              assert item["max_margin_ratio"] == 0.35
              assert item["min_available_ratio"] == 0.25
              assert item["max_daily_loss_ratio"] == 0.05
              assert item["max_total_drawdown_ratio"] == 0.30
              assert item["max_contract_volume"] == 35
          assert report["mechanics"]["target_gross_leverage_cap"] == 2.0
          assert base["annualized_return"] >= 1.0
          assert base["max_drawdown"] >= -0.30
          assert not base["halted"]
          assert stress["max_drawdown"] >= -0.30
          assert not stress["halted"]
          assert base["max_realized_gross_notional_ratio"] <= 2.0 + 1e-9
          assert stress["max_realized_gross_notional_ratio"] <= 2.0 + 1e-9
          for side in ("base", "stress"):
              attr = report.get("turnover_attribution", {}).get(side, {})
              assert abs(float(attr.get("total", 0.0)) - float(attr.get("attributed_total", 0.0))) <= max(1e-6, abs(float(attr.get("total", 0.0))) * 1e-10)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-80-l3-${{ github.sha }}
          path: |
            runtime/directional_production_mechanics_report.json
            runtime/directional_production_base_daily.csv
            runtime/directional_production_stress_daily.csv
            runtime/execution_aligned_weights.csv
            runtime/execution_aligned_target_report.json
            runtime/stress_80_l3.log
