name: unattended-source-evidence

# Development transport only: no broker credentials, account access or deployment.
# Removed once the source-backed runtime validation is integrated into normal CI.
on:
  push:
    branches: [codex/unattended-24x7-20260922]
    paths: [.github/workflows/unattended-source-evidence.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve source and Git object manifest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afuture-source"
          git rev-parse HEAD > "$RUNNER_TEMP/afuture-source/SOURCE_SHA"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/afuture-source/git-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/afuture-source/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/afuture-source/source.tar.gz" > "$RUNNER_TEMP/afuture-source/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: afuture-source-${{ github.sha }}
          path: ${{ runner.temp }}/afuture-source/
          retention-days: 7
          if-no-files-found: error
