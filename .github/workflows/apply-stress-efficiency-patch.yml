name: apply-stress-efficiency-patch

on:
  push:
    branches:
      - codex/afuture-stress-80-efficiency-20260823
    paths:
      - .github/scripts/stress_efficiency_edit.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/afuture-stress-80-efficiency-20260823
          fetch-depth: 0
      - name: Apply asserted source edit
        shell: bash
        run: |
          set -euo pipefail
          script=.github/scripts/stress_efficiency_edit.py
          test -s "$script"
          message=$(sed -n 's/^# message: //p' "$script" | head -n1)
          test -n "$message"
          python "$script"
          git rm "$script"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git push origin HEAD:codex/afuture-stress-80-efficiency-20260823
