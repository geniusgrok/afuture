name: apply-stress-efficiency-patch

on:
  push:
    branches:
      - codex/afuture-stress-80-efficiency-20260823
    paths:
      - .github/patches/stress-efficiency.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/afuture-stress-80-efficiency-20260823
          fetch-depth: 0
      - name: Validate and apply patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/stress-efficiency.patch
          test -s "$patch"
          message=$(sed -n 's/^# message: //p' "$patch" | head -n1)
          test -n "$message"
          tail -n +2 "$patch" > /tmp/stress-efficiency.patch
          git apply --check /tmp/stress-efficiency.patch
          git apply /tmp/stress-efficiency.patch
          git rm "$patch"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git push origin HEAD:codex/afuture-stress-80-efficiency-20260823
