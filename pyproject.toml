[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afuture"
version = "0.2.0"
description = "Focused Chinese futures calendar-spread and directional portfolio trading engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
live = [
  "vnpy>=4.4,<5",
  "vnpy_ctp>=6.7.11.4,<7",
  "akshare>=1.17",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
afuture = "afuture.command_router:main"

[tool.setuptools.packages.find]
include = ["afuture*"]

[tool.setuptools.package-data]
afuture = ["runtime_calendar.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
